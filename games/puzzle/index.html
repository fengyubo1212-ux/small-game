<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>图片拼图 - Mini Game Platform</title>
<link rel="preload" as="image" href="../../test1.jpg">
<link rel="preload" as="image" href="../../test2.jpg">
<link rel="preload" as="image" href="../../test3.jpg">
<link rel="stylesheet" href="../../shared/platform.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font-display);
  background: var(--bg-deep);
  min-height: 100dvh;
  display: flex; justify-content: center; align-items: center;
  overflow-x: hidden;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* =============================================================
   VIEW TRANSITIONS
   ============================================================= */
.view {
  position: relative; z-index:2;
  width:100%; max-width:420px; padding:16px;
}
.view.fade-out {
  opacity:0; transform:translateY(10px); pointer-events:none;
  transition: opacity .25s ease, transform .25s ease;
}
.view.fade-in {
  opacity:1; transform:translateY(0);
  transition: opacity .25s ease, transform .25s ease;
}

/* =============================================================
   LEVEL SELECT VIEW
   ============================================================= */
.level-select { padding: 16px; }

.level-select .page-title {
  text-align: center; margin-bottom: 6px;
}
.page-title h1 {
  font-size: 24px; font-weight:900; letter-spacing:1px;
  background: linear-gradient(180deg, #fff 20%, #c4b5fd 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}
.page-title .sub {
  font-size: 11px; color: var(--text-dim); letter-spacing:2px; margin-top:2px;
}

/* 关卡卡片网格 */
.level-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 20px;
}

.level-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  transition: transform var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.level-card:active {
  transform: scale(.95);
  border-color: rgba(168,85,247,.4);
  box-shadow: 0 0 24px rgba(139,92,246,.2);
}

.level-card .card-img {
  aspect-ratio: 1; overflow:hidden;
}
.level-card .card-img img {
  width:100%; height:100%; object-fit:cover; display:block;
}

.level-card .card-label {
  padding: 12px 12px;
  text-align: center;
  font-size: 14px; font-weight:700; color:#fff; letter-spacing:.3px;
}

.level-card .card-best {
  font-size: 10px; color: rgba(255,255,255,.3);
  margin-top: 2px;
}

/* =============================================================
   DIFFICULTY MODAL
   ============================================================= */
.diff-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.diff-btn {
  padding: 18px 10px;
  border-radius: var(--radius-md);
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  color: #fff;
  cursor: pointer;
  text-align: center;
  transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
  font-family: var(--font-display);
}

.diff-btn .diff-size { font-size: 22px; font-weight:900; display:block; letter-spacing:-.5px; }
.diff-btn .diff-label{ font-size: 11px; color:rgba(255,255,255,.35); margin-top:4px; display:block; letter-spacing:.5px; }

.diff-btn:hover { background: rgba(255,255,255,.06); }
.diff-btn:active {
  background: rgba(168,85,247,.18);
  border-color: rgba(168,85,247,.4);
  transform: scale(.96);
}

/* =============================================================
   GAME VIEW
   ============================================================= */
.game-view { padding: 16px; }

/* HUD */
.hud {
  display: flex; align-items:center; gap:8px;
  margin-bottom: 8px;
}

.hud-item {
  flex:1; padding: 10px 8px;
  border-radius: var(--radius-sm);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  text-align: center;
}

.hud-item .hud-label {
  font-size: 9px; font-weight:700; letter-spacing:1px;
  color: rgba(255,255,255,.3); text-transform: uppercase;
  margin-bottom: 2px;
}
.hud-item .hud-val {
  font-size: 17px; font-weight:900; color:#fff;
}

/* 进度条 */
.progress-wrap {
  height: 4px; border-radius:2px;
  background: rgba(255,255,255,.06);
  margin-bottom: 12px; overflow:hidden;
}
.progress-fill {
  height:100%; border-radius:2px;
  background: linear-gradient(90deg, #a78bfa, var(--accent-gold));
  transition: width .4s cubic-bezier(.16,1,.3,1);
  width: 0%;
}

/* 拼块桌面端hover */
@media (hover: hover) {
  .puzzle-piece:hover {
    box-shadow: 0 4px 14px rgba(0,0,0,.35) !important;
    transform: scale(1.03) !important;
    z-index: 5 !important;
  }
}

/* 拼图区 */
.puzzle-area {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border-radius: var(--radius-md);
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.06);
  overflow: hidden;
}

/* 参考图低透明度背景 */
.puzzle-area .bg-ref {
  position: absolute; inset:0;
  background-size: cover; background-position:center;
  opacity: .12;
  pointer-events:none;
  z-index:0;
}

/* 拼块容器 */
.pieces-layer {
  position: absolute; inset:0; z-index:1;
}

/* 工具栏 */
.toolbar {
  display: flex; justify-content:center; gap:12px;
  margin-top: 14px;
}

.tool-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  cursor: pointer;
  font-size: 20px;
  display: flex; align-items:center; justify-content:center;
  transition: background var(--transition-fast), transform var(--transition-fast);
  color: rgba(255,255,255,.55);
}
.tool-btn:hover { background: rgba(255,255,255,.08); }
.tool-btn:active { background: rgba(255,255,255,.14); transform:scale(.92); }

/* =============================================================
   REFERENCE IMAGE PANEL
   ============================================================= */
.u-hidden { display:none !important; }

.ref-panel {
  position: fixed; inset:0; z-index:90;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex; align-items:center; justify-content:center;
}
.ref-panel img {
  max-width: 85vw; max-height: 75vh;
  border-radius: var(--radius-md);
  box-shadow: 0 16px 48px rgba(0,0,0,.5);
}

/* =============================================================
   COMPLETION ANIMATION ELEMENTS
   ============================================================= */
.frame-glow {
  position: absolute; inset:-4px;
  border-radius: var(--radius-md);
  border: 3px solid transparent;
  pointer-events:none; z-index:5;
  transition: border-color .8s ease, box-shadow .8s ease;
}
.frame-glow.active {
  border-color: var(--accent-gold);
  box-shadow: 0 0 32px rgba(251,191,36,.3), inset 0 0 32px rgba(251,191,36,.08);
}

.complete-overlay {
  position: absolute; inset:0; z-index:10;
  background: rgba(0,0,0,.0);
  pointer-events:none;
  transition: background .6s ease;
}
.complete-overlay.active {
  background: rgba(0,0,0,.45);
}

.canvas-confetti {
  position: fixed; inset:0; pointer-events:none; z-index:150;
}

/* =============================================================
   COMPLETION MODAL
   ============================================================= */
.stars-display {
  display: flex; justify-content:center; gap:8px; margin:10px 0 6px;
}
.stars-display .s {
  font-size: 30px; color:rgba(255,255,255,.15);
}
.stars-display .s.earned {
  color: var(--accent-gold);
  animation: starPop .45s ease-out forwards;
}
@keyframes starPop {
  0%{transform:scale(0);} 60%{transform:scale(1.35);} 100%{transform:scale(1);}
}

.complete-stats {
  display: flex; justify-content:center; gap:24px;
  margin: 8px 0 18px;
}
.complete-stat {
  text-align: center;
}
.complete-stat .val {
  font-size: 20px; font-weight:900; color:#fff;
}
.complete-stat .lbl {
  font-size: 10px; color:rgba(255,255,255,.35); letter-spacing:1px; margin-top:2px;
}
</style>
</head>
<body>

<div class="bg-space"></div>
<div class="bg-stars"></div>
<div class="glow-orb purple"></div>
<div class="glow-orb blue"></div>
<div class="glow-orb pink"></div>

<!-- ========== 关卡选择 ========== -->
<div class="view level-select" id="levelView">
  <div class="back-pill" onclick="location.href='../../index.html'">← 大厅</div>
  <div class="page-title">
    <h1>图片拼图</h1>
    <div class="sub">JIGSAW PUZZLE</div>
  </div>
  <div class="level-grid" id="levelGrid"></div>
</div>

<!-- ========== 游戏界面 ========== -->
<div class="view game-view u-hidden" id="gameView">
  <div class="back-pill" onclick="showLevelSelect()">← 关卡</div>

  <div class="hud">
    <div class="hud-item"><div class="hud-label">关卡</div><div class="hud-val" id="hudLevel">-</div></div>
    <div class="hud-item"><div class="hud-label">用时</div><div class="hud-val" id="hudTime">00:00</div></div>
    <div class="hud-item"><div class="hud-label">进度</div><div class="hud-val" id="hudProgress">0/16</div></div>
  </div>

  <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>

  <div class="puzzle-area" id="puzzleArea">
    <div class="bg-ref" id="bgRef"></div>
    <div class="pieces-layer" id="piecesLayer"></div>
    <div class="frame-glow" id="frameGlow"></div>
    <div class="complete-overlay" id="completeOverlay"></div>
  </div>

  <div class="toolbar">
    <button class="tool-btn" id="btnRef" title="参考图">📷</button>
    <button class="tool-btn" id="btnRestart" title="重新开始">🔄</button>
    <button class="tool-btn" id="btnSettings" title="设置" disabled style="opacity:.3">⚙</button>
  </div>
</div>

<!-- ========== 参考图弹窗 ========== -->
<div class="ref-panel u-hidden" id="refPanel" onclick="this.classList.add('u-hidden')">
  <img id="refImage" src="" alt="参考图">
</div>

<!-- ========== 难度选择弹窗 ========== -->
<div id="diffOverlay" class="modal-overlay u-hidden">
  <div class="modal-box">
    <div class="modal-icon">🧩</div>
    <div class="modal-title">选择难度</div>
    <div class="modal-subtitle" id="diffLevelName"></div>
    <div class="diff-grid">
      <button class="diff-btn" data-diff="easy">  <span class="diff-size">3×3</span><span class="diff-label">简单</span></button>
      <button class="diff-btn" data-diff="normal"><span class="diff-size">4×4</span><span class="diff-label">普通</span></button>
      <button class="diff-btn" data-diff="hard">  <span class="diff-size">5×5</span><span class="diff-label">困难</span></button>
      <button class="diff-btn" data-diff="expert"><span class="diff-size">6×6</span><span class="diff-label">专家</span></button>
    </div>
    <button class="btn-secondary" onclick="closeDiffModal()" style="width:100%">取消</button>
  </div>
</div>

<!-- ========== 完成弹窗 ========== -->
<div id="completeOverlay2" class="modal-overlay u-hidden">
  <div class="modal-box">
    <div class="modal-icon">🎉</div>
    <div class="modal-title">拼图完成！</div>
    <div class="stars-display" id="starsDisplay">
      <span class="s">★</span><span class="s">★</span><span class="s">★</span>
    </div>
    <div class="complete-stats">
      <div class="complete-stat"><div class="val" id="statTime">-</div><div class="lbl">用时</div></div>
      <div class="complete-stat"><div class="val" id="statMoves">-</div><div class="lbl">移动</div></div>
    </div>
    <button class="btn-primary" onclick="restartPuzzle()" style="margin-bottom:8px">再玩一次</button>
    <button class="btn-secondary" onclick="closeCompleteModal()" style="width:100%">返回关卡</button>
  </div>
</div>

<canvas class="canvas-confetti u-hidden" id="confettiCanvas"></canvas>

<script>
// ===== 关卡配置 =====
const LEVELS = [
  { id:'cat', image:'../../test1.jpg', name:'小猫' },
  { id:'dog', image:'../../test2.jpg', name:'小狗' },
  { id:'flower', image:'../../test3.jpg', name:'花朵' },
];

const DIFFICULTIES = {
  easy:   { grid:3, label:'3×3', pieces:9,  snapRange:40, timeBonus:1.0 },
  normal: { grid:4, label:'4×4', pieces:16, snapRange:30, timeBonus:1.2 },
  hard:   { grid:5, label:'5×5', pieces:25, snapRange:22, timeBonus:1.5 },
  expert: { grid:6, label:'6×6', pieces:36, snapRange:18, timeBonus:2.0 },
};

// ===== 状态 =====
let currentLevel = null;
let currentDiff = 'normal';

// ===== 关卡选择 =====
function renderLevelCards() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';

  LEVELS.forEach(lv => {
    const bestKey = `puzzle_best_${lv.id}_${currentDiff}`;
    const best = JSON.parse(localStorage.getItem(bestKey) || '{}');

    const card = document.createElement('div');
    card.className = 'level-card';
    card.innerHTML = `
      <div class="card-img"><img src="${lv.image}" alt="${lv.name}" draggable="false"></div>
      <div class="card-label">${lv.name}
        ${best.stars ? `<div class="card-best">最佳: ${'★'.repeat(best.stars)} ${best.time || ''}s</div>` : ''}
      </div>
    `;
    card.addEventListener('click', () => openDiffModal(lv));
    grid.appendChild(card);
  });
}

// ===== 难度弹窗 =====
let _pendingLevel = null;

document.getElementById('diffOverlay').addEventListener('click', function(e) {
  const btn = e.target.closest('.diff-btn');
  if (btn && _pendingLevel) {
    currentDiff = btn.dataset.diff;
    closeDiffModal();
    startGame(_pendingLevel, currentDiff);
  }
});

function openDiffModal(level) {
  _pendingLevel = level;
  document.getElementById('diffLevelName').textContent = level.name;
  document.getElementById('diffOverlay').classList.remove('u-hidden');

  // 高亮已记录最佳成绩的难度
  document.querySelectorAll('.diff-btn').forEach(btn => {
    const diff = btn.dataset.diff;
    const key = `puzzle_best_${level.id}_${diff}`;
    const best = JSON.parse(localStorage.getItem(key) || '{}');
    btn.style.borderColor = best.stars ? 'rgba(251,191,36,.35)' : '';
  });
}

function closeDiffModal() {
  document.getElementById('diffOverlay').classList.add('u-hidden');
  _pendingLevel = null;
}

// ===== 视图切换 =====
function showLevelSelect() {
  stopTimer();
  const gameView = document.getElementById('gameView');
  const levelView = document.getElementById('levelView');
  document.getElementById('completeOverlay2').classList.add('u-hidden');
  document.getElementById('diffOverlay').classList.add('u-hidden');
  document.getElementById('refPanel').classList.add('u-hidden');

  gameView.classList.add('fade-out');
  gameView.classList.remove('fade-in');
  setTimeout(() => {
    gameView.classList.add('u-hidden');
    levelView.classList.remove('u-hidden');
    levelView.classList.remove('fade-out');
    levelView.classList.add('fade-in');
    renderLevelCards();
  }, 250);
}

function startGame(level, diff) {
  console.log('=== [START GAME] ===');
  console.log('level:', level ? level.id : 'NULL', 'diff:', diff);
  currentLevel = level;
  currentDiff = diff;
  const levelView = document.getElementById('levelView');
  const gameView = document.getElementById('gameView');

  levelView.classList.add('fade-out');
  levelView.classList.remove('fade-in');
  setTimeout(() => {
    levelView.classList.add('u-hidden');
    gameView.classList.remove('u-hidden');
    gameView.classList.remove('fade-out');
    gameView.classList.add('fade-in');
    console.log('gameView u-hidden removed, display:', getComputedStyle(gameView).display);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        console.log('calling initPuzzle from double RAF');
        initPuzzle(level, diff);
      });
    });
  }, 250);
}

// ===== 计时器 =====
let timerInterval = null;
let timerSeconds = 0;

function startTimer() {
  stopTimer();
  timerSeconds = 0;
  updateTimerDisplay();
  resumeTimer();
}

function resumeTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimerDisplay();
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  document.getElementById('hudTime').textContent =
    String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

// ===== 拼图系统 =====
let pieces = [];
let puzzleCfg = null;
let moveCount = 0;
let dragPiece = null;
let dragStartX = 0, dragStartY = 0;
let dragOffX = 0, dragOffY = 0;
let puzzleCompleted = false;

function initPuzzle(level, diff) {
  console.log('=== [INIT PUZZLE] START ===');

  // ① 关卡对象
  console.log('① Level:', JSON.stringify(level));
  console.log('   Difficulty key:', diff);
  if (!level) { console.error('❌ level is null/undefined'); return; }
  if (!diff) { console.error('❌ diff is null/undefined'); return; }

  puzzleCfg = DIFFICULTIES[diff];
  if (!puzzleCfg) { console.error('❌ DIFFICULTIES[' + diff + '] not found. Keys:', Object.keys(DIFFICULTIES)); return; }
  console.log('   puzzleCfg:', JSON.stringify(puzzleCfg));

  // ② 图片加载
  console.log('② Image path:', level.image);
  const testImg = new Image();
  testImg.onload = function() {
    console.log('   Image loaded. Natural size:', testImg.naturalWidth + '×' + testImg.naturalHeight);
  };
  testImg.onerror = function() {
    console.error('❌ Image load FAILED:', level.image);
  };
  testImg.src = level.image;

  puzzleCompleted = false;
  const grid = puzzleCfg.grid;
  console.log('③ Grid:', grid + '×' + grid, 'Expected pieces:', grid * grid);

  // ④ 容器尺寸
  const area = document.getElementById('puzzleArea');
  if (!area) { console.error('❌ #puzzleArea not found in DOM'); return; }
  const areaW = area.clientWidth;
  const areaH = area.clientHeight;
  console.log('④ Puzzle area dimensions:', areaW + '×' + areaH);
  if (areaW === 0 || areaH === 0) {
    console.error('❌ Puzzle area has ZERO dimensions! Layout not complete.');
    console.log('   area display:', getComputedStyle(area).display);
    console.log('   parent display:', getComputedStyle(area.parentElement).display);
    return;
  }

  const pieceSize = Math.floor(Math.min(areaW, areaH) / grid);
  console.log('   pieceSize:', pieceSize);
  if (pieceSize === 0) { console.error('❌ pieceSize is 0'); return; }

  document.getElementById('hudLevel').textContent = level.name;
  document.getElementById('hudProgress').textContent = `0/${grid * grid}`;
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('bgRef').style.backgroundImage = `url(${level.image})`;
  document.getElementById('bgRef').style.backgroundSize = 'cover';

  resetPuzzleAreaState();

  pieces = [];
  moveCount = 0;
  const layer = document.getElementById('piecesLayer');
  if (!layer) { console.error('❌ #piecesLayer not found'); return; }
  console.log('⑤ piecesLayer children before:', layer.children.length);
  layer.innerHTML = '';

  // ⑥ 生成散落位置
  const positions = generateScatteredPositions(grid * grid, areaW, areaH, pieceSize);
  console.log('⑥ Positions generated:', positions.length);

  if (positions.length !== grid * grid) {
    console.error('❌ Position count mismatch! Expected', grid * grid, 'got', positions.length);
    return;
  }

  // ⑦ 创建拼块
  let createdCount = 0;
  for (let i = 0; i < grid * grid; i++) {
    const correctRow = Math.floor(i / grid);
    const correctCol = i % grid;
    const pos = positions[i];
    if (!pos) { console.error('❌ Position[' + i + '] is undefined'); continue; }

    const el = document.createElement('div');
    el.className = 'puzzle-piece';
    el.style.position = 'absolute';
    el.style.width = pieceSize + 'px';
    el.style.height = pieceSize + 'px';
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';
    el.style.backgroundImage = `url(${level.image})`;
    el.style.backgroundSize = (areaW) + 'px ' + (areaH) + 'px';
    el.style.backgroundPosition = `-${correctCol * pieceSize}px -${correctRow * pieceSize}px`;
    el.style.borderRadius = '8px';
    el.style.boxShadow = '0 2px 8px rgba(0,0,0,.3)';
    el.style.cursor = 'grab';
    el.style.zIndex = '1';
    el.style.transition = 'left .18s ease, top .18s ease, transform .18s ease, box-shadow .18s ease, border-radius .18s ease';
    el.style.transform = `rotate(${pos.rot}deg)`;
    el.style.touchAction = 'none';

    el.addEventListener('mousedown', (e) => onDragStart(e, i));
    el.addEventListener('touchstart', (e) => onDragStart(e, i), { passive: false });

    layer.appendChild(el);

    pieces.push({
      id: i, correctRow, correctCol, el,
      x: pos.x, y: pos.y, rotation: pos.rot, placed: false,
    });
    createdCount++;
  }

  console.log('⑦ Pieces created:', createdCount);
  console.log('   piecesLayer children after:', layer.children.length);
  console.log('   pieces array length:', pieces.length);

  // ⑧ 验证首个拼块
  if (pieces.length > 0) {
    const p0 = pieces[0];
    const cs = getComputedStyle(p0.el);
    console.log('⑧ First piece check:');
    console.log('   width:', cs.width, 'height:', cs.height);
    console.log('   display:', cs.display, 'visibility:', cs.visibility);
    console.log('   opacity:', cs.opacity, 'z-index:', cs.zIndex);
    console.log('   position:', cs.position);
    console.log('   left:', cs.left, 'top:', cs.top);
    console.log('   backgroundImage:', cs.backgroundImage ? cs.backgroundImage.substring(0, 50) + '...' : 'NONE');
  } else {
    console.error('❌ No pieces created at all!');
  }

  console.log('=== [INIT PUZZLE] DONE ===');

  updateProgress();
  startTimer();
}

function generateScatteredPositions(count, areaW, areaH, pieceSize) {
  console.log('--- generateScatteredPositions ---');
  console.log('   count:', count, 'areaW:', areaW, 'areaH:', areaH, 'pieceSize:', pieceSize);

  if (pieceSize <= 0) {
    console.error('❌ pieceSize <= 0, cannot generate positions');
    return [];
  }

  const positions = [];
  const margin = 6;
  const maxAttempts = 300;
  const rangeX = areaW - pieceSize - margin * 2;
  const rangeY = areaH - pieceSize - margin * 2;
  console.log('   rangeX:', rangeX, 'rangeY:', rangeY);

  if (rangeX <= 0 || rangeY <= 0) {
    console.error('❌ Position range is <= 0! Pieces are too big for the area.');
    return [];
  }

  for (let i = 0; i < count; i++) {
    let x, y, attempts = 0;
    do {
      x = margin + Math.random() * rangeX;
      y = margin + Math.random() * rangeY;
      attempts++;
    } while (attempts < maxAttempts && positions.some(p =>
      Math.abs(p.x - x) < pieceSize * 0.7 && Math.abs(p.y - y) < pieceSize * 0.7
    ));

    if (attempts >= maxAttempts) {
      console.warn('⚠ Piece', i, 'reached max attempts, using last position');
    }

    const rot = (Math.random() - 0.5) * 8;
    positions.push({ x, y, rot });
  }
  return positions;
}

// ===== 拖拽系统 =====
function onDragStart(e, pieceId) {
  if (pieces[pieceId].placed) return;
  e.preventDefault();

  dragPiece = pieces[pieceId];
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;

  const rect = dragPiece.el.getBoundingClientRect();
  dragOffX = clientX - rect.left;
  dragOffY = clientY - rect.top;
  dragStartX = dragPiece.x;
  dragStartY = dragPiece.y;

  // 清除任何进行中的过渡，确保拖拽即时响应
  dragPiece.el.style.transition = 'none';
  dragPiece.el.style.zIndex = '10';
  dragPiece.el.style.cursor = 'grabbing';
  dragPiece.el.style.boxShadow = '0 10px 32px rgba(0,0,0,.45)';
  dragPiece.el.style.transform = 'scale(1.05) rotate(0deg)';
  dragPiece.el.style.borderRadius = '8px';

  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
  document.addEventListener('touchmove', onDragMove, { passive: false });
  document.addEventListener('touchend', onDragEnd);
}

function onDragMove(e) {
  if (!dragPiece) return;
  e.preventDefault();

  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;

  const area = document.getElementById('puzzleArea');
  const areaRect = area.getBoundingClientRect();
  const pieceSize = parseFloat(dragPiece.el.style.width);

  let newX = clientX - areaRect.left - dragOffX;
  let newY = clientY - areaRect.top - dragOffY;

  // 允许略微溢出边界，手感更自然
  newX = Math.max(-pieceSize * 0.2, Math.min(newX, areaRect.width - pieceSize * 0.8));
  newY = Math.max(-pieceSize * 0.2, Math.min(newY, areaRect.height - pieceSize * 0.8));

  dragPiece.x = newX;
  dragPiece.y = newY;
  dragPiece.el.style.left = newX + 'px';
  dragPiece.el.style.top = newY + 'px';
}

function onDragEnd(e) {
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
  document.removeEventListener('touchmove', onDragMove);
  document.removeEventListener('touchend', onDragEnd);

  if (!dragPiece) return;

  dragPiece.el.style.cursor = 'grab';
  dragPiece.el.style.zIndex = '1';
  dragPiece.el.style.borderRadius = '6px';
  // 只对位置和旋转做弹性过渡，box-shadow 单独处理
  dragPiece.el.style.transition = 'left .38s cubic-bezier(.34,1.56,.64,1), top .38s cubic-bezier(.34,1.56,.64,1), transform .38s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, border-radius .2s ease';

  trySnap(dragPiece);
  moveCount++;
  dragPiece = null;
}

// ===== 吸附检测 =====
function trySnap(piece) {
  const area = document.getElementById('puzzleArea');
  const areaW = area.clientWidth;
  const areaH = area.clientHeight;
  const grid = puzzleCfg.grid;
  const pieceSize = Math.floor(Math.min(areaW, areaH) / grid);
  const offsetX = (areaW - pieceSize * grid) / 2;
  const offsetY = (areaH - pieceSize * grid) / 2;

  const snapR = puzzleCfg.snapRange;
  const correctX = offsetX + piece.correctCol * pieceSize;
  const correctY = offsetY + piece.correctRow * pieceSize;

  const dist = Math.hypot(piece.x - correctX, piece.y - correctY);

  if (dist < snapR) {
    const occupied = pieces.some(p =>
      p.id !== piece.id && p.placed &&
      p.correctRow === piece.correctRow && p.correctCol === piece.correctCol
    );
    if (occupied) {
      // 目标被占，弹回拖动前位置
      piece.el.style.transition = 'left .35s cubic-bezier(.34,1.56,.64,1), top .35s cubic-bezier(.34,1.56,.64,1)';
      piece.el.style.left = dragStartX + 'px';
      piece.el.style.top = dragStartY + 'px';
      piece.el.style.transform = `rotate(${piece.rotation}deg)`;
      piece.el.style.boxShadow = '0 2px 8px rgba(0,0,0,.3)';
      piece.x = dragStartX;
      piece.y = dragStartY;
      return;
    }

    // 吸附到正确位置
    piece.x = correctX;
    piece.y = correctY;
    piece.placed = true;
    piece.el.style.left = correctX + 'px';
    piece.el.style.top = correctY + 'px';
    piece.el.style.transform = 'rotate(0deg) scale(1)';
    piece.el.style.boxShadow = '0 0 0 2px rgba(34,197,94,.4), 0 2px 8px rgba(0,0,0,.2)';
    piece.el.style.borderRadius = '6px';
    piece.el.style.cursor = 'default';
    piece.el.style.pointerEvents = 'auto';
    piece.el.style.zIndex = '1';
    updateProgress();
    checkComplete();
  } else {
    // 不吸附，保留在放下的位置，恢复自然旋转
    piece.el.style.transform = `rotate(${piece.rotation}deg) scale(1)`;
    piece.el.style.boxShadow = '0 2px 8px rgba(0,0,0,.3)';
  }

  // 动画结束后恢复默认过渡
  setTimeout(() => {
    if (piece.el) {
      piece.el.style.transition = 'left .18s ease, top .18s ease, transform .18s ease, box-shadow .18s ease, border-radius .18s ease';
    }
  }, 420);
}

function updateProgress() {
  if (!puzzleCfg) return;
  const placed = pieces.filter(p => p.placed).length;
  const total = puzzleCfg.grid * puzzleCfg.grid;
  document.getElementById('hudProgress').textContent = `${placed}/${total}`;
  document.getElementById('progressFill').style.width = (placed / total * 100) + '%';
}

// ===== 完成动画序列 =====
function checkComplete() {
  if (!puzzleCfg || puzzleCompleted) return;
  const total = puzzleCfg.grid * puzzleCfg.grid;
  const placed = pieces.filter(p => p.placed).length;
  if (placed !== total) return;

  puzzleCompleted = true;
  stopTimer();

  // 0ms: 所有拼块锁定
  pieces.forEach(p => { p.placed = true; p.el.style.pointerEvents = 'none'; });

  // 400ms: 图片发光
  setTimeout(() => {
    pieces.forEach(p => {
      p.el.style.boxShadow = '0 0 16px rgba(251,191,36,.5), 0 0 0 1px rgba(251,191,36,.3)';
      p.el.style.transition = 'all .6s ease';
    });
  }, 400);

  // 700ms: 拼块缝隙消失
  setTimeout(() => {
    const area = document.getElementById('puzzleArea');
    const areaW = area.clientWidth;
    const grid = puzzleCfg.grid;
    const pieceSize = Math.floor(Math.min(areaW, area.clientHeight) / grid);
    const offsetX = (areaW - pieceSize * grid) / 2;
    const offsetY = (area.clientHeight - pieceSize * grid) / 2;

    pieces.forEach(p => {
      const cx = offsetX + p.correctCol * pieceSize;
      const cy = offsetY + p.correctRow * pieceSize;
      p.el.style.left = cx + 'px';
      p.el.style.top = cy + 'px';
      p.el.style.borderRadius = '0px';
      p.el.style.boxShadow = 'none';
      p.el.style.transition = 'all .5s cubic-bezier(.16,1,.3,1)';
    });
  }, 700);

  // 900ms: 相框出现
  setTimeout(() => {
    document.getElementById('frameGlow').classList.add('active');
    const area = document.getElementById('puzzleArea');
    area.style.transform = 'scale(1.03)';
    area.style.transition = 'transform .5s cubic-bezier(.16,1,.3,1)';
  }, 900);

  // 1100ms: 背景变暗
  setTimeout(() => {
    document.getElementById('completeOverlay').classList.add('active');
    const area = document.getElementById('puzzleArea');
    area.style.transform = 'scale(1.05)';
    area.style.boxShadow = '0 16px 48px rgba(0,0,0,.4)';
  }, 1100);

  // 1300ms: 礼花
  setTimeout(() => {
    spawnConfetti();
  }, 1300);

  // 2100ms: 结算弹窗（先让玩家欣赏完成图 ~800ms）
  setTimeout(() => {
    const area = document.getElementById('puzzleArea');
    area.style.transform = 'scale(1.0)';
    showCompleteModal();
  }, 2100);
}

// ===== 散花粒子 =====
function spawnConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  canvas.classList.remove('u-hidden');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');

  const colors = ['#fbbf24','#f59e0b','#a78bfa','#7c3aed','#ec4899','#3b82f6','#22c55e','#fff'];
  const particles = [];

  for (let i = 0; i < 120; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.3,
      vx: (Math.random() - .5) * 3,
      vy: 2 + Math.random() * 4,
      size: 4 + Math.random() * 7,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - .5) * 10,
      life: 1, decay: .3 + Math.random() * .5,
    });
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += .05;
      p.rotation += p.rotSpeed;
      p.life -= p.decay * .016;
      if (p.life <= 0) continue;
      alive = true;
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .6);
      ctx.restore();
    }
    if (alive) requestAnimationFrame(animate);
    else { canvas.classList.add('u-hidden'); ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  requestAnimationFrame(animate);
}

function showCompleteModal() {
  const stars = calcStarsLocal();

  if (currentLevel && currentDiff) {
    const key = `puzzle_best_${currentLevel.id}_${currentDiff}`;
    const prev = JSON.parse(localStorage.getItem(key) || '{}');
    if (!prev.stars || stars > prev.stars || (stars === prev.stars && timerSeconds < prev.time)) {
      localStorage.setItem(key, JSON.stringify({ time: timerSeconds, stars, moves: moveCount, date: new Date().toISOString() }));
    }
  }

  const starEls = document.querySelectorAll('#starsDisplay .s');
  starEls.forEach((el, i) => {
    el.classList.remove('earned');
    if (i < stars) setTimeout(() => el.classList.add('earned'), 200 + i * 150);
  });
  document.getElementById('statTime').textContent = formatTime(timerSeconds);
  document.getElementById('statMoves').textContent = moveCount;
  document.getElementById('completeOverlay2').classList.remove('u-hidden');
}

function calcStarsLocal() {
  const bonus = puzzleCfg ? puzzleCfg.timeBonus : 1;
  if (timerSeconds < 30 * bonus) return 3;
  if (timerSeconds < 90 * bonus) return 2;
  return 1;
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

// ===== 参考图 =====
document.getElementById('btnRef').addEventListener('click', () => {
  if (!currentLevel) return;
  document.getElementById('refImage').src = currentLevel.image;
  document.getElementById('refPanel').classList.remove('u-hidden');
});

// ===== 重新开始 =====
document.getElementById('btnRestart').addEventListener('click', () => {
  if (!currentLevel) return;
  initPuzzle(currentLevel, currentDiff);
});

function resetPuzzleAreaState() {
  const area = document.getElementById('puzzleArea');
  area.style.transform = '';
  area.style.boxShadow = '';
  area.style.transition = '';
  document.getElementById('frameGlow').classList.remove('active');
  document.getElementById('completeOverlay').classList.remove('active');
  document.getElementById('confettiCanvas').classList.add('u-hidden');
}

function restartPuzzle() {
  document.getElementById('completeOverlay2').classList.add('u-hidden');
  resetPuzzleAreaState();
  if (currentLevel) initPuzzle(currentLevel, currentDiff);
}

function closeCompleteModal() {
  document.getElementById('completeOverlay2').classList.add('u-hidden');
  resetPuzzleAreaState();
  showLevelSelect();
}

// ===== 窗口大小变化：重算拼块位置 =====
let _resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimeout);
  _resizeTimeout = setTimeout(() => {
    if (!puzzleCfg || puzzleCompleted || pieces.length === 0) return;
    const area = document.getElementById('puzzleArea');
    const areaW = area.clientWidth;
    const areaH = area.clientHeight;
    const grid = puzzleCfg.grid;
    const pieceSize = Math.floor(Math.min(areaW, areaH) / grid);
    const offsetX = (areaW - pieceSize * grid) / 2;
    const offsetY = (areaH - pieceSize * grid) / 2;

    pieces.forEach(p => {
      p.el.style.width = pieceSize + 'px';
      p.el.style.height = pieceSize + 'px';
      p.el.style.backgroundSize = areaW + 'px ' + areaH + 'px';
      p.el.style.backgroundPosition = `-${p.correctCol * pieceSize}px -${p.correctRow * pieceSize}px`;

      if (p.placed) {
        const cx = offsetX + p.correctCol * pieceSize;
        const cy = offsetY + p.correctRow * pieceSize;
        p.x = cx; p.y = cy;
        p.el.style.left = cx + 'px';
        p.el.style.top = cy + 'px';
      }
    });
  }, 300);
});

// ===== 页面可见性：后台暂停计时 =====
document.addEventListener('visibilitychange', () => {
  if (!puzzleCfg || puzzleCompleted) return;
  if (document.hidden) {
    stopTimer();
  } else {
    resumeTimer();
  }
});

// ===== 启动 =====
renderLevelCards();
</script>
