<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>贪吃蛇 - MiniVerse</title>
<link rel="stylesheet" href="../../shared/platform.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font-display);
  background: var(--bg-deep);
  min-height: 100dvh;
  display: flex; justify-content: center; align-items: center;
  overflow-x: hidden;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.view { position:relative; z-index:2; width:100%; max-width:420px; padding:14px; }

/* HUD */
.hud-bar {
  display: flex; align-items:center; gap:8px;
  margin-bottom: 10px;
}
.hud-item {
  flex:1; padding: 10px 6px; text-align:center;
  border-radius: var(--radius-sm);
  background: var(--glass-bg); border:1px solid var(--glass-border);
}
.hud-item .lbl { font-size:9px; font-weight:700; letter-spacing:1px; color:rgba(255,255,255,.3); text-transform:uppercase; }
.hud-item .val { font-size:16px; font-weight:900; color:#fff; transition: transform .15s var(--transition-smooth); }
.hud-item .val.pulse { transform: scale(1.2); }
.hud-pause {
  width:44px; height:44px; border-radius:50%;
  background: var(--glass-bg); border:1px solid var(--glass-border);
  cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center;
  color:rgba(255,255,255,.5); flex-shrink:0;
  transition: background var(--transition-fast), transform var(--transition-fast);
}
.hud-pause:active { background:rgba(255,255,255,.14); transform:scale(.92); }

/* Canvas 容器 */
.canvas-wrap {
  position:relative;
  border-radius: 20px;
  padding: 8px;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.06);
  box-shadow: 0 16px 48px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
}
.canvas-wrap canvas {
  display:block; width:100%; aspect-ratio:1;
  border-radius: 12px;
  background: radial-gradient(ellipse at center, #120d28 0%, #080418 100%);
}

/* Ready 叠加层 */
.ready-overlay {
  position:absolute; inset:0; z-index:5;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background: rgba(8,4,20,.55); border-radius:12px;
}
.ready-overlay .title {
  font-size:22px; font-weight:900; letter-spacing:1.5px;
  background: linear-gradient(180deg,#fff 20%,#c4b5fd 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:6px;
}
.ready-overlay .hint { font-size:12px; color:rgba(255,255,255,.35); letter-spacing:1px; margin-bottom:4px; }
.ready-overlay .countdown {
  font-size:48px; font-weight:900; color:#fff; display:none;
  animation: cdPop .5s var(--transition-smooth);
}
@keyframes cdPop { 0%{transform:scale(1.8);opacity:0;} 100%{transform:scale(1);opacity:1;} }

/* 暂停遮罩 */
.pause-overlay {
  position:absolute; inset:0; z-index:5; display:none;
  flex-direction:column; align-items:center; justify-content:center;
  background: rgba(8,4,20,.6); backdrop-filter: blur(4px); border-radius:12px;
}
.pause-overlay .pause-text { font-size:28px; font-weight:900; color:#fff; letter-spacing:2px; margin-bottom:16px; }

/* 移动端方向键 */
.dpad {
  display:none; justify-content:center; margin-top:14px;
}
.dpad-grid {
  display:grid; grid-template-columns:56px 56px 56px; grid-template-rows:56px 56px 56px;
  gap:4px;
}
.dpad-btn {
  width:56px; height:56px; border-radius:16px;
  background: var(--glass-bg); border:1px solid var(--glass-border);
  cursor:pointer; font-size:22px; display:flex; align-items:center; justify-content:center;
  color:rgba(255,255,255,.55);
  transition: background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
  -webkit-tap-highlight-color:transparent;
}
.dpad-btn:active { background:rgba(168,85,247,.25); box-shadow:0 0 14px rgba(139,92,246,.3); transform:scale(.9); }
.dpad-empty { width:56px; height:56px; }

/* Combo 提示 */
.combo-pop {
  position:fixed; top:40%; left:50%; transform:translate(-50%,-50%);
  font-size:28px; font-weight:900; color:var(--food-gold);
  text-shadow:0 0 20px rgba(251,191,36,.5);
  pointer-events:none; z-index:30; opacity:0;
  animation: comboIn .7s ease-out forwards;
}
@keyframes comboIn {
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
  100%{opacity:0;transform:translate(-50%,-65%) scale(1);}
}

/* NEW BEST 提示 */
.new-best {
  position:fixed; top:30%; left:50%; transform:translate(-50%,-50%);
  font-size:20px; font-weight:900; letter-spacing:2px;
  color:var(--food-gold); text-shadow:0 0 24px rgba(251,191,36,.6);
  pointer-events:none; z-index:30; opacity:0;
  animation: comboIn 1s ease-out forwards;
}

@media (hover:none) and (pointer:coarse) {
  .dpad { display:flex; }
}
</style>
</head>
<body>

<div class="bg-space"></div><div class="bg-stars"></div>
<div class="glow-orb purple"></div><div class="glow-orb blue"></div><div class="glow-orb pink"></div>

<div class="view">
  <div class="back-pill" onclick="location.href='../../index.html'">← 大厅</div>

  <div class="hud-bar">
    <div class="hud-item"><div class="lbl">Score</div><div class="val" id="hudScore">0</div></div>
    <div class="hud-item"><div class="lbl">Best</div><div class="val" id="hudBest">0</div></div>
    <button class="hud-pause" id="btnPause" title="暂停">⏸</button>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="gameCanvas"></canvas>
    <div class="ready-overlay" id="readyOverlay" onclick="startCountdown()">
      <div class="title">MiniVerse Snake</div>
      <div class="hint" id="readyHint">点击任意位置 或 按方向键开始</div>
      <div class="countdown" id="countdownText"></div>
    </div>
    <div class="pause-overlay" id="pauseOverlay">
      <div class="pause-text">PAUSED</div>
      <button class="btn-primary" onclick="resumeGame()" style="width:180px;margin-bottom:8px">继续</button>
      <button class="btn-secondary" onclick="restartGame()" style="width:180px">重新开始</button>
    </div>
  </div>

  <div class="dpad" id="dpad">
    <div class="dpad-grid">
      <div class="dpad-empty"></div>
      <button class="dpad-btn" data-dir="up">↑</button>
      <div class="dpad-empty"></div>
      <button class="dpad-btn" data-dir="left">←</button>
      <div class="dpad-empty"></div>
      <button class="dpad-btn" data-dir="right">→</button>
      <div class="dpad-empty"></div>
      <button class="dpad-btn" data-dir="down">↓</button>
      <div class="dpad-empty"></div>
    </div>
  </div>
</div>

<div id="resultOverlay" class="modal-overlay u-hidden">
  <div class="modal-box">
    <div class="modal-icon">🎮</div>
    <div class="modal-title" id="resultTitle">游戏结束</div>
    <div class="modal-subtitle" id="resultSub"></div>
    <button class="btn-primary" onclick="restartGame()" style="margin-bottom:8px">再来一局</button>
    <button class="btn-secondary" onclick="location.href='../../index.html'" style="width:100%">返回大厅</button>
  </div>
</div>

<script>
/* ================================================================
   CONFIG — 所有可调参数
   ================================================================ */
const CONFIG = {
  grid: 16,
  cellSize: 0,
  canvasSize: 0,
  initialInterval: 130,
  minInterval: 60,
  speedStep: 8,
  speedEvery: 5,
  comboThreshold: 2,
  starCount: 25,
  particlePerFood: 14,
  particlePerDeath: 8,
  deathDelay: 40,
};

/* ================================================================
   STORAGE
   ================================================================ */
const STORAGE = {
  get(k, d)   { const v = localStorage.getItem('snake_'+k); return v !== null ? JSON.parse(v) : d; },
  set(k, v)   { localStorage.setItem('snake_'+k, JSON.stringify(v)); },
  best()      { return this.get('best_score', 0); },
  setBest(v)  { this.set('best_score', v); },
  games()     { return this.get('total_games', 0); },
  incGames()  { this.set('total_games', this.games() + 1); },
  food()      { return this.get('total_food', 0); },
  addFood(n)  { this.set('total_food', this.food() + n); },
  playTime()  { return this.get('play_time', 0); },
  addTime(s)  { this.set('play_time', this.playTime() + s); },
};

/* ================================================================
   GAME STATE — 统一状态机
   ================================================================ */
const STATE = { BOOT:0, READY:1, COUNTDOWN:2, PLAYING:3, PAUSED:4, GAME_OVER:5, RESULT:6 };
let gs = STATE.BOOT;
let score = 0, comboCount = 0, foodEatenThisGame = 0, gameStartTime = 0;
let tickInterval = CONFIG.initialInterval;
let lastTick = 0, tickAccum = 0;

/* ================================================================
   CANVAS
   ================================================================ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let cw = 0, ch = 0;

function resizeCanvas() {
  const wrap = document.getElementById('canvasWrap');
  const w = Math.min(wrap.clientWidth - 16, 420);
  canvas.style.width = w + 'px';
  canvas.style.height = w + 'px';
  const dpr = devicePixelRatio || 1;
  canvas.width = w * dpr;
  canvas.height = w * dpr;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);
  cw = w; ch = w;
  CONFIG.canvasSize = w;
  CONFIG.cellSize = w / CONFIG.grid;
}

/* ================================================================
   INPUT
   ================================================================ */
let dir = { x:1, y:0 }, nextDir = { x:1, y:0 };

function setDir(dx, dy) {
  if (gs === STATE.READY) startCountdown();
  if (gs !== STATE.PLAYING && gs !== STATE.READY) return;
  if (dx === -dir.x && dy === -dir.y && snake.length > 1) return;
  nextDir = { x:dx, y:dy };
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (gs===STATE.PLAYING) pauseGame(); else if (gs===STATE.PAUSED) resumeGame(); return; }
  if (e.key === ' ' || e.key === 'Enter') { if (gs===STATE.READY) startCountdown(); return; }
  const map = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0], W:[0,-1], S:[0,1], A:[-1,0], D:[1,0] };
  const d = map[e.key];
  if (d) { e.preventDefault(); setDir(d[0], d[1]); }
});

document.querySelectorAll('.dpad-btn').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}; const d=m[b.dataset.dir]; if(d) setDir(d[0],d[1]); });
});

/* ================================================================
   SNAKE
   ================================================================ */
let snake = [];
let snakeTrail = [];

function initSnake() {
  const g = CONFIG.grid;
  const mx = Math.floor(g/2), my = Math.floor(g/2);
  snake = [{x:mx,y:my},{x:mx-1,y:my},{x:mx-2,y:my}];
  snake.forEach(s => { s.px=s.x; s.py=s.y; });
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  snakeTrail = [];
}

function moveSnake() {
  dir = { ...nextDir };
  const head = snake[0];
  const newHead = { x: head.x + dir.x, y: head.y + dir.y, px: head.x, py: head.y };

  if (newHead.x < 0 || newHead.x >= CONFIG.grid || newHead.y < 0 || newHead.y >= CONFIG.grid) {
    return 'wall';
  }
  if (snake.some(s => s.x === newHead.x && s.y === newHead.y)) {
    return 'self';
  }

  snake.unshift(newHead);
  snake.forEach(s => { s.px = s.x; s.py = s.y; });

  if (newHead.x === foodPos.x && newHead.y === foodPos.y) {
    eatFood();
  } else {
    const tail = snake.pop();
    snakeTrail.push({ ...tail, life: 1 });
  }

  return 'ok';
}

/* ================================================================
   FOOD
   ================================================================ */
let foodPos = { x:0, y:0 };
let foodAngle = 0, foodGlowPhase = 0;
let foodParticles = [];

function spawnFood() {
  const g = CONFIG.grid;
  let x, y;
  do { x = Math.floor(Math.random()*g); y = Math.floor(Math.random()*g); }
  while (snake.some(s => s.x === x && s.y === y));
  foodPos = { x, y };
  foodAngle = 0;
}

function eatFood() {
  comboCount++;
  foodEatenThisGame++;
  score += Math.max(1, Math.floor(comboCount / CONFIG.comboThreshold)) * 10;

  const bonus = Math.floor(comboCount / CONFIG.comboThreshold);
  if (bonus > 1) showCombo(bonus);

  spawnFoodParticles(foodPos.x, foodPos.y);
  spawnFood();

  if (foodEatenThisGame % CONFIG.speedEvery === 0) {
    tickInterval = Math.max(CONFIG.minInterval, tickInterval - CONFIG.speedStep);
  }

  pulseHUD();
}

/* ================================================================
   PARTICLES
   ================================================================ */
let particles = [];

function spawnFoodParticles(gx, gy) {
  const cx = (gx + .5) * CONFIG.cellSize, cy = (gy + .5) * CONFIG.cellSize;
  for (let i = 0; i < CONFIG.particlePerFood; i++) {
    const a = Math.random()*Math.PI*2, s = 40+Math.random()*100;
    particles.push({ x:cx, y:cy, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, decay:1.5+Math.random()*2, size:1.5+Math.random()*3, color:'#fbbf24' });
  }
}

function spawnDeathParticles(gx, gy, alpha) {
  const cx = (gx + .5) * CONFIG.cellSize, cy = (gy + .5) * CONFIG.cellSize;
  const r = 139 + Math.floor(92 * alpha), g = 92 + Math.floor(154 * alpha), b = 246;
  const color = `rgba(${r},${g},${b},1)`;
  for (let i = 0; i < CONFIG.particlePerDeath; i++) {
    const a = Math.random()*Math.PI*2, s = 20+Math.random()*60;
    particles.push({ x:cx, y:cy, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, decay:1+Math.random()*1.5, size:2+Math.random()*3, color });
  }
}

function updateParticles(dt) {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  snakeTrail = snakeTrail.filter(t => { t.life -= 2*dt; return t.life > 0; });
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  for (const t of snakeTrail) {
    ctx.globalAlpha = t.life * .4;
    ctx.fillStyle = '#8b5cf6';
    const s = CONFIG.cellSize;
    ctx.fillRect(t.x*s+1, t.y*s+1, s-2, s-2);
  }
  ctx.globalAlpha = 1;
}

/* ================================================================
   RENDERER
   ================================================================ */
function drawBackground() {
  ctx.fillStyle = 'rgba(8,4,20,.85)';
  ctx.fillRect(0,0,cw,ch);
  ctx.strokeStyle = 'rgba(255,255,255,.02)';
  ctx.lineWidth = .5;
  for (let i=0;i<=CONFIG.grid;i++) {
    const p = i*CONFIG.cellSize;
    ctx.beginPath(); ctx.moveTo(p,0); ctx.lineTo(p,ch); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,p); ctx.lineTo(cw,p); ctx.stroke();
  }
  // 星点
  const seed = 42;
  for (let i=0;i<CONFIG.starCount;i++) {
    const sx = ((seed*i*7+13)%1000)/1000*cw, sy = ((seed*i*11+29)%1000)/1000*ch;
    ctx.fillStyle = 'rgba(255,255,255,'+(.15+.1*Math.sin(Date.now()/2000+i))+' )';
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }
}

function drawSnake(interp) {
  const s = CONFIG.cellSize;
  for (let i = snake.length-1; i >= 0; i--) {
    const seg = snake[i];
    const px = seg.px + (seg.x - seg.px) * interp;
    const py = seg.py + (seg.y - seg.py) * interp;

    const t = snake.length > 1 ? i / (snake.length - 1) : 0;
    const r = Math.round(139 + t * 28);
    const g = Math.round(92 + t * 60);
    const b = Math.round(246 - t * 30);
    const alpha = 1 - t * .75;

    ctx.fillStyle = i === 0
      ? '#a78bfa'
      : `rgba(${r},${g},${b},${alpha})`;

    const pad = i === 0 ? 1 : 2;
    roundRect(px * s + pad, py * s + pad, s - pad*2, s - pad*2, i === 0 ? 6 : 4);
    ctx.fill();

    if (i === 0) {
      ctx.shadowColor = 'rgba(167,139,250,.5)';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
}

function drawFood() {
  const s = CONFIG.cellSize;
  const cx = (foodPos.x + .5) * s, cy = (foodPos.y + .5) * s;
  foodAngle += .02;
  foodGlowPhase += .04;

  const glowR = 8 + Math.sin(foodGlowPhase) * 4;
  const grd = ctx.createRadialGradient(cx, cy, 2, cx, cy, glowR+6);
  grd.addColorStop(0, 'rgba(255,255,255,.9)');
  grd.addColorStop(.3, 'rgba(251,191,36,.7)');
  grd.addColorStop(.7, 'rgba(251,191,36,.1)');
  grd.addColorStop(1, 'rgba(251,191,36,0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(cx, cy, glowR+6, 0, Math.PI*2); ctx.fill();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(foodAngle);
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fef3c7';
  ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
  ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

/* ================================================================
   HUD
   ================================================================ */
function updateHUD() {
  document.getElementById('hudScore').textContent = score;
  document.getElementById('hudBest').textContent = STORAGE.best();
}

function pulseHUD() {
  const el = document.getElementById('hudScore');
  el.classList.add('pulse');
  setTimeout(() => el.classList.remove('pulse'), 150);
}

function showCombo(n) {
  const el = document.createElement('div');
  el.className = 'combo-pop';
  el.textContent = 'Combo ×' + n;
  el.style.top = '35%';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

function showNewBest() {
  const el = document.createElement('div');
  el.className = 'new-best';
  el.textContent = 'NEW BEST!';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

/* ================================================================
   MODAL
   ================================================================ */
function showResult() {
  gs = STATE.RESULT;
  const isNewBest = score > 0 && score >= STORAGE.best();
  if (isNewBest) { STORAGE.setBest(score); showNewBest(); }
  STORAGE.incGames();
  STORAGE.addFood(foodEatenThisGame);
  STORAGE.addTime(Math.floor((Date.now() - gameStartTime) / 1000));
  updateHUD();

  document.getElementById('resultTitle').textContent = isNewBest ? '🏆 新纪录！' : '游戏结束';
  document.getElementById('resultSub').innerHTML = `
    <div style="display:flex;justify-content:center;gap:20px;margin:8px 0">
      <div style="text-align:center"><div style="font-size:20px;font-weight:900;color:#fff">${score}</div><div style="font-size:10px;color:rgba(255,255,255,.35)">Score</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:900;color:#fbbf24">${STORAGE.best()}</div><div style="font-size:10px;color:rgba(255,255,255,.35)">Best</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:900;color:#fff">${foodEatenThisGame}</div><div style="font-size:10px;color:rgba(255,255,255,.35)">Food</div></div>
    </div>
  `;
  document.getElementById('resultOverlay').classList.remove('u-hidden');
}

/* ================================================================
   STATE MACHINE
   ================================================================ */
function startCountdown() {
  if (gs !== STATE.READY) return;
  gs = STATE.COUNTDOWN;
  const cdEl = document.getElementById('countdownText');
  const hintEl = document.getElementById('readyHint');
  hintEl.style.display = 'none';
  cdEl.style.display = 'block';

  let count = 3;
  cdEl.textContent = count;
  const iv = setInterval(() => {
    count--;
    if (count > 0) { cdEl.textContent = count; cdEl.style.animation = 'none'; cdEl.offsetHeight; cdEl.style.animation = 'cdPop .5s var(--transition-smooth)'; }
    else if (count === 0) { cdEl.textContent = 'GO!'; cdEl.style.animation = 'none'; cdEl.offsetHeight; cdEl.style.animation = 'cdPop .5s var(--transition-smooth)'; }
    else { clearInterval(iv); cdEl.style.display = 'none'; hintEl.style.display = ''; document.getElementById('readyOverlay').style.display = 'none'; startPlaying(); }
  }, 500);
}

function startPlaying() {
  gs = STATE.PLAYING;
  gameStartTime = Date.now();
  lastTick = performance.now();
  tickAccum = 0;
  document.getElementById('btnPause').style.display = '';
}

function pauseGame() {
  if (gs !== STATE.PLAYING) return;
  gs = STATE.PAUSED;
  document.getElementById('pauseOverlay').style.display = 'flex';
}

function resumeGame() {
  if (gs !== STATE.PAUSED) return;
  gs = STATE.PLAYING;
  lastTick = performance.now();
  tickAccum = 0;
  document.getElementById('pauseOverlay').style.display = 'none';
}

let deathTimer = null;

function triggerGameOver() {
  gs = STATE.GAME_OVER;
  document.getElementById('btnPause').style.display = 'none';

  let i = snake.length - 1;
  deathTimer = setInterval(() => {
    if (i < 0) { clearInterval(deathTimer); deathTimer = null; showResult(); return; }
    const seg = snake[i];
    const alpha = snake.length > 1 ? 1 - i / (snake.length - 1) : 1;
    spawnDeathParticles(seg.x, seg.y, alpha);
    snake.splice(i, 1);
    i--;
  }, CONFIG.deathDelay);
}

function restartGame() {
  clearInterval(deathTimer);
  deathTimer = null;
  document.getElementById('resultOverlay').classList.add('u-hidden');
  document.getElementById('pauseOverlay').style.display = 'none';
  document.getElementById('readyOverlay').style.display = 'flex';
  document.getElementById('readyHint').style.display = '';
  document.getElementById('countdownText').style.display = 'none';
  document.getElementById('btnPause').style.display = '';
  score = 0; comboCount = 0; foodEatenThisGame = 0;
  tickInterval = CONFIG.initialInterval;
  particles = []; snakeTrail = [];
  initSnake(); spawnFood();
  updateHUD();
  gs = STATE.READY;
}

/* ================================================================
   GAME LOOP
   ================================================================ */
function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  if (gs !== STATE.PLAYING && gs !== STATE.GAME_OVER) { drawFrame(0); return; }

  const dt = Math.min((ts - lastTick) / 1000, .2);
  lastTick = ts;

  if (gs === STATE.PLAYING) {
    tickAccum += dt;
    while (tickAccum >= tickInterval / 1000) {
      tickAccum -= tickInterval / 1000;
      const result = moveSnake();
      if (result !== 'ok') { triggerGameOver(); break; }
    }
  }

  updateParticles(dt);
  const interp = tickInterval > 0 ? Math.min(tickAccum / (tickInterval / 1000), 1) : 1;
  drawFrame(interp);
}

function drawFrame(interp) {
  ctx.clearRect(0, 0, cw, ch);
  drawBackground();
  if (gs !== STATE.BOOT) {
    drawSnake(interp || 0);
    drawFood();
  }
  drawParticles();
}

/* ================================================================
   INIT
   ================================================================ */
function init() {
  resizeCanvas();
  initSnake();
  spawnFood();
  updateHUD();
  gs = STATE.READY;
  requestAnimationFrame(gameLoop);
}

window.addEventListener('resize', () => {
  resizeCanvas();
  CONFIG.cellSize = CONFIG.canvasSize / CONFIG.grid;
});

document.getElementById('btnPause').addEventListener('click', () => {
  if (gs === STATE.PLAYING) pauseGame();
});

init();
</script>
