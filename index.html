<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>图片消消乐</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: "MiSans","HarmonyOS Sans","PingFang SC",system-ui,sans-serif;
  background: #1a0a2e;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color: transparent;
}

/* ===== 星空调色背景 ===== */
.bg-stars {
  position: fixed; inset:0; z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, #2d1b69 0%, transparent 60%),
    radial-gradient(ellipse 60% 70% at 80% 30%, #1a3a5c 0%, transparent 55%),
    radial-gradient(ellipse 70% 50% at 50% 80%, #3d1259 0%, transparent 55%),
    radial-gradient(ellipse 100% 100% at 50% 50%, #0d0618 0%, #0a0412 100%);
}

.bg-dots {
  position: fixed; inset:0; z-index:0;
  background-image: radial-gradient(circle, rgba(255,255,255,.15) 1px, transparent 1px);
  background-size: 32px 32px;
}

/* ===== 装饰光斑 ===== */
.glow {
  position: fixed; border-radius:50%; pointer-events:none; z-index:0;
  filter: blur(80px); opacity:.35;
}
.glow-1 { width:220px; height:220px; background:#8b5cf6; top:5%; left:-60px; }
.glow-2 { width:180px; height:180px; background:#3b82f6; top:55%; right:-50px; }
.glow-3 { width:200px; height:200px; background:#f472b6; bottom:-40px; left:30%; }

/* ===== 主菜单容器 ===== */
.menu {
  position: relative; z-index:2;
  width:100%; max-width:400px;
  padding: 48px 28px 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

/* ===== 顶部装饰 ===== */
.menu-crown {
  width: 56px; height: 56px;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  border-radius: 18px;
  display: flex; align-items:center; justify-content:center;
  font-size: 28px;
  box-shadow: 0 8px 24px rgba(245,158,11,.35), 0 0 0 4px rgba(251,191,36,.15);
  margin-bottom: -8px;
}

/* ===== 标题 ===== */
.title-block { text-align: center; }

.title-main {
  font-size: 38px; font-weight:900; letter-spacing: 3px;
  background: linear-gradient(180deg, #fff 20%, #e0c3fc 60%, #c4b5fd 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 2px 8px rgba(168,85,247,.4));
  line-height: 1.2;
}

.title-sub {
  font-size: 13px; color: rgba(255,255,255,.45);
  letter-spacing: 4px;
  margin-top: 2px;
}

/* ===== 主按钮 ===== */
.btn-play {
  width: 100%;
  padding: 20px;
  border: none; border-radius: 20px;
  font-size: 20px; font-weight:800; letter-spacing: 2px;
  color: #fff;
  background: linear-gradient(180deg, #a78bfa 0%, #7c3aed 100%);
  box-shadow:
    0 8px 0 #5b21b6,
    0 12px 28px rgba(124,58,237,.45);
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease;
  position: relative; top: 0;
}

.btn-play:active {
  transform: translateY(4px);
  box-shadow: 0 4px 0 #5b21b6, 0 8px 18px rgba(124,58,237,.35);
}

.btn-play::after {
  content: '';
  position: absolute; top:4px; left:12%; right:12%; height:35%;
  background: linear-gradient(180deg, rgba(255,255,255,.25), transparent);
  border-radius: 20px; pointer-events:none;
}

/* ===== 次级按钮 ===== */
.btn-secondary {
  padding: 14px 36px;
  border: 1.5px solid rgba(255,255,255,.18);
  border-radius: 50px;
  font-size: 14px; font-weight:700; letter-spacing: 1px;
  color: rgba(255,255,255,.7);
  background: rgba(255,255,255,.06);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  cursor: pointer;
  transition: all .2s ease;
}

.btn-secondary:active {
  background: rgba(255,255,255,.14);
  color: #fff;
}

/* ===== 分隔线 ===== */
.divider {
  width: 60%; height:1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
}

/* ===== 迷你游戏图标 ===== */
.mini-games {
  display: flex; gap: 16px;
}

.mini-icon {
  width: 52px; height: 52px;
  border-radius: 14px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  display: flex; align-items:center; justify-content:center;
  font-size: 24px;
  transition: transform .2s ease;
}

.mini-icon:active { transform: scale(.9); }

.mini-label {
  font-size: 10px; color: rgba(255,255,255,.3);
  text-align: center; margin-top: 6px;
}

/* ===== 底部 ===== */
.footer-text {
  font-size: 11px; color: rgba(255,255,255,.2);
  letter-spacing: 2px;
}
</style>
</head>
<body>

<div class="bg-stars"></div>
<div class="bg-dots"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<div class="menu">
  <div class="menu-crown">🧩</div>

  <div class="title-block">
    <div class="title-main">图片消消乐</div>
    <div class="title-sub">MATCH 3 PUZZLE</div>
  </div>

  <a href="match3.html" style="width:100%;text-decoration:none;">
    <button class="btn-play">开始游戏</button>
  </a>

  <div class="divider"></div>

  <div style="text-align:center">
    <div style="font-size:12px;color:rgba(255,255,255,.3);letter-spacing:2px;margin-bottom:12px;">更多游戏</div>
    <div class="mini-games">
      <div style="text-align:center">
        <div class="mini-icon">🐍</div>
        <div class="mini-label">贪吃蛇</div>
      </div>
      <div style="text-align:center">
        <div class="mini-icon">🔢</div>
        <div class="mini-label">2048</div>
      </div>
      <div style="text-align:center">
        <div class="mini-icon">🧩</div>
        <div class="mini-label">拼图</div>
      </div>
    </div>
  </div>

  <div class="footer-text">v1.0</div>
</div>

</body>
</html>
