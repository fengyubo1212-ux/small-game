<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小游戏合集</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  justify-content: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #e8e0f0 0%, #d0e0f0 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-user-select: none;
  user-select: none;
}

.lobby {
  width: 100%;
  max-width: 400px;
  padding: 32px 16px;
}

.header {
  text-align: center;
  margin-bottom: 28px;
}

.header .icon { font-size: 40px; margin-bottom: 6px; }
.header .title { font-size: 24px; font-weight: 800; color: #333; }

.games-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.game-card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}

.game-card:active {
  transform: scale(0.96);
  box-shadow: 0 1px 6px rgba(0,0,0,0.12);
}

.game-card .cover {
  aspect-ratio: 1;
  overflow: hidden;
}

.game-card .cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.game-card .name {
  text-align: center;
  padding: 12px 8px;
  font-size: 14px;
  font-weight: 600;
  color: #333;
}

.game-card.placeholder {
  cursor: default;
}

.game-card.placeholder:active {
  transform: none;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.game-card.placeholder .cover {
  background: #f0edf5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  color: #c0b8d0;
}

.game-card.placeholder .name {
  color: #b0b0b0;
}
</style>
</head>
<body>
<div class="lobby">
  <div class="header">
    <div class="icon">🎮</div>
    <div class="title">小游戏合集</div>
  </div>

  <div class="games-grid">
    <a class="game-card" href="match3.html">
      <div class="cover"><img src="test1.jpg" alt="图片消消乐" draggable="false"></div>
      <div class="name">图片消消乐</div>
    </a>

    <div class="game-card placeholder">
      <div class="cover">🔜</div>
      <div class="name">敬请期待</div>
    </div>

    <div class="game-card placeholder">
      <div class="cover">🔜</div>
      <div class="name">敬请期待</div>
    </div>
  </div>
</div>
</body>
</html>
