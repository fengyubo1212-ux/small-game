<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>图片消消乐</title>
<style>
/* ===== CSS 变量 ===== */
:root {
  --bg-from: #F6F7FB;
  --bg-mid: #E8EEFF;
  --bg-to: #FFF7F2;
  --glass-bg: rgba(255,255,255,.62);
  --glass-border: rgba(255,255,255,.45);
  --glass-shadow: 0 20px 50px rgba(0,0,0,.1);
  --accent: #667eea;
  --accent-2: #764ba2;
  --text-primary: #1c1c1e;
  --text-secondary: #8e8e93;
  --radius-card: 20px;
  --radius-btn: 16px;
  --radius-cell: 12px;
  --font-display: "MiSans", "HarmonyOS Sans", system-ui, -apple-system, sans-serif;
  --transition-smooth: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100dvh;
  background: linear-gradient(170deg, var(--bg-from) 0%, var(--bg-mid) 40%, var(--bg-to) 100%);
  font-family: var(--font-display);
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  overflow-x: hidden;
}

/* ===== 背景光球 ===== */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(130px);
  opacity: 0.28;
}
.bg-orb.orb-blue  { width:320px;height:320px;background:#5B8DEF;top:-120px;left:-80px; }
.bg-orb.orb-purple{ width:260px;height:260px;background:#9B7BFF;top:50%;right:-100px; }
.bg-orb.orb-orange{ width:240px;height:240px;background:#FF9A76;bottom:-80px;left:20%; }

/* ===== 视图过渡 ===== */
.fade-view {
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.fade-view.hidden {
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
}

/* ===== 地图视图 ===== */
.map-container {
  width: 100%;
  max-width: 420px;
  padding: 16px;
  position: relative;
  z-index: 1;
}

.map-path {
  position: relative;
  padding: 8px 0 16px;
  overflow-y: auto;
  max-height: 52vh;
}

.map-path svg {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.level-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 1;
}

.map-header {
  text-align: center;
  padding: 24px 0 16px;
}

.map-icon { font-size: 44px; margin-bottom: 6px; }

.map-title {
  font-size: 24px;
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: -0.3px;
}

.map-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.level-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: absolute;
  z-index: 1;
}

.level-dot {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 800;
  color: white;
  position: relative;
  z-index: 1;
  transition: transform 0.2s ease;
  cursor: pointer;
}

.level-node.done .level-dot {
  background: linear-gradient(135deg, #43e97b, #38f9d7);
  box-shadow: 0 0 0 4px rgba(67,233,123,.25);
}

.level-node.current .level-dot {
  background: linear-gradient(135deg, #FF9A76, #FF6B6B);
  width: 56px;
  height: 56px;
  font-size: 22px;
  box-shadow: 0 0 0 8px rgba(255,107,107,.2), 0 0 24px rgba(255,107,107,.15);
  animation: pulse 2s ease-in-out infinite;
}

.level-node.locked .level-dot {
  background: #d5d5da;
  color: #999;
}

.level-connector {
  width: 3px;
  height: 28px;
  border-radius: 2px;
}

.level-node.done ~ .level-connector,
.level-connector.done { background: #43e97b; }
.level-node.current ~ .level-connector,
.level-connector.current { background: #FF9A76; }
.level-connector.locked { background: #e5e5ea; }

.level-label {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 4px;
  font-weight: 500;
}

.level-node.current .level-label {
  color: #FF6B6B;
  font-weight: 700;
}

/* ===== 星级显示 ===== */
.stars-row {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin: 8px 0 4px;
}

.star {
  font-size: 26px;
  transition: transform 0.3s ease, opacity 0.3s ease;
}

.star.empty { opacity: 0.25; filter: grayscale(1); }

.star.earned {
  animation: starPop 0.4s ease-out forwards;
}

@keyframes starPop {
  0% { transform: scale(0); }
  60% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* ===== 地图小星级 ===== */
.level-stars {
  display: flex;
  gap: 2px;
  margin-top: 2px;
  font-size: 10px;
}

.level-star { opacity: 0.25; }

.level-star.filled { opacity: 1; }

@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 8px rgba(255,107,107,.2), 0 0 24px rgba(255,107,107,.15); }
  50% { transform: scale(1.06); box-shadow: 0 0 0 14px rgba(255,107,107,.08), 0 0 36px rgba(255,107,107,.1); }
}

.map-hint {
  text-align: center;
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.8;
  padding: 12px 20px;
  margin-top: 4px;
  letter-spacing: 0.3px;
}

.back-bar {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 10px 16px;
  margin-bottom: 4px;
  cursor: pointer;
  font-size: 14px;
  color: var(--accent);
  font-weight: 600;
  -webkit-tap-highlight-color: transparent;
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 50px;
  transition: transform 0.2s ease;
}

.back-bar:active { transform: scale(0.95); }

.back-bar .arrow { font-size: 16px; }

/* ===== 游戏视图 ===== */
.game-view {
  width: 100%;
  max-width: 420px;
  padding: 16px;
  position: relative;
  z-index: 1;
}

.status-bar {
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-card);
  padding: 18px 20px;
  margin-bottom: 14px;
  box-shadow: var(--glass-shadow);
}

.status-bar .level-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-primary);
  text-align: center;
  margin-bottom: 10px;
  letter-spacing: -0.2px;
}

.status-bar .info-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 600;
}

.status-bar .steps-bar {
  height: 5px;
  background: rgba(0,0,0,.06);
  border-radius: 3px;
  margin-top: 10px;
  overflow: hidden;
}

.status-bar .steps-fill {
  height: 100%;
  background: linear-gradient(90deg, #FF9A76, #FF6B6B);
  border-radius: 3px;
  transition: width 0.4s ease;
}

.board {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 4px;
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  padding: 8px;
  box-shadow: 0 24px 60px rgba(0,0,0,.12), 0 0 0 1px rgba(255,255,255,.5) inset;
  touch-action: none;
}

.cell {
  aspect-ratio: 1;
  border-radius: var(--radius-cell);
  overflow: hidden;
  position: relative;
  transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

.cell.selected {
  transform: scale(1.08);
  box-shadow: 0 0 0 3px var(--accent), 0 4px 16px rgba(102,126,234,.3);
  z-index: 2;
}

.cell img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.cell.swapping {
  opacity: 0.5;
  transform: scale(0.9);
}

.cell.removing {
  opacity: 0;
  transform: scale(0.3) rotate(15deg);
}

.combo-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 36px;
  font-weight: 900;
  color: #FF6B6B;
  text-shadow: 0 2px 16px rgba(255,107,107,.5);
  pointer-events: none;
  z-index: 10;
  letter-spacing: -0.5px;
  animation: comboBounce 0.7s ease-out forwards;
}

@keyframes comboBounce {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
  40% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

.modal {
  background: var(--glass-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 36px 24px 28px;
  text-align: center;
  width: 280px;
  box-shadow: 0 24px 60px rgba(0,0,0,.18);
}

.modal .icon { font-size: 48px; margin-bottom: 12px; }
.modal .title { font-size: 22px; font-weight: 800; color: var(--text-primary); margin-bottom: 6px; letter-spacing: -0.2px; }
.modal .subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 22px; }
.modal button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius-btn);
  font-size: 16px;
  font-weight: 700;
  color: white;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 4px 16px rgba(102,126,234,.3);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  letter-spacing: 0.3px;
}

.modal button:active {
  transform: scale(0.95);
  box-shadow: 0 2px 8px rgba(102,126,234,.2);
}

/* ===== 棋盘 + 粒子画布 ===== */
.board-wrapper {
  position: relative;
}

.board-wrapper .board {
  position: relative;
  z-index: 1;
}

#particleCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 3;
}

/* ===== 掉落弹跳动画 ===== */
@keyframes dropBounce {
  0%   { transform: translateY(-80px); opacity: 0; }
  50%  { transform: translateY(4px); opacity: 1; }
  70%  { transform: translateY(-6px); }
  85%  { transform: translateY(2px); }
  100% { transform: translateY(0); }
}

.cell.drop-in {
  animation: dropBounce 0.45s ease-out forwards;
}

/* ===== 得分上浮 ===== */
.score-float {
  position: fixed;
  pointer-events: none;
  z-index: 20;
  font-size: 18px;
  font-weight: 800;
  color: #FF6B6B;
  text-shadow: 0 1px 4px rgba(0,0,0,.1);
  animation: scoreRise 0.9s ease-out forwards;
}

@keyframes scoreRise {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
}

/* ===== 失败抖动 ===== */
.board.shake {
  animation: shake 0.5s ease-out;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  15% { transform: translateX(-6px); }
  30% { transform: translateX(6px); }
  45% { transform: translateX(-4px); }
  60% { transform: translateX(4px); }
  75% { transform: translateX(-2px); }
}

/* ===== 棋盘变灰 ===== */
.board.grayout {
  filter: grayscale(1) brightness(0.7);
  transition: filter 0.4s ease;
}

/* ===== 胜利粒子 ===== */
.win-particle {
  position: fixed;
  pointer-events: none;
  z-index: 150;
  border-radius: 3px;
  animation: confettiFall 1.2s ease-out forwards;
}

@keyframes confettiFall {
  0%   { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translateY(110vh) rotate(720deg) scale(0.3); }
}
</style>
</head>
<body>

<div class="bg-orb orb-blue"></div>
<div class="bg-orb orb-purple"></div>
<div class="bg-orb orb-orange"></div>

<!-- ===== 地图视图 ===== -->
<div class="map-container fade-view" id="mapView">
  <div class="back-bar" onclick="location.href='index.html'">
    <span class="arrow">←</span> 返回大厅
  </div>
  <div class="map-header">
    <div class="map-icon">🗺️</div>
    <div class="map-title">图片消消乐</div>
    <div class="map-subtitle" id="maxLevelText">最高关卡: 第 1 关</div>
  </div>
  <div class="map-path" id="mapPath"></div>
  <div class="map-hint">
    交换相邻图片 → 三个相同连成一线 → 消除得分<br>达成目标分数即可过关
  </div>
</div>

<!-- ===== 游戏视图 ===== -->
<div class="game-view" id="gameView" style="display:none">
  <div class="back-bar" onclick="showMap()">
    <span class="arrow">←</span> 关卡地图
  </div>
  <div class="status-bar">
    <div class="level-title" id="levelTitle">第 1 关</div>
    <div class="info-row">
      <span id="scoreText">分数: 0 / 100</span>
      <span id="stepsText">步数: 20</span>
    </div>
    <div class="steps-bar">
      <div class="steps-fill" id="stepsFill" style="width:100%"></div>
    </div>
  </div>
  <div class="board-wrapper">
    <div class="board" id="board"></div>
    <canvas id="particleCanvas"></canvas>
  </div>
</div>
<div id="overlayContainer"></div>
<div id="comboContainer"></div>
<div id="scoreFloatContainer"></div>

<script>
// ===== 图片缩略图生成 + 取色 =====
const IMAGE_FILES = ['test1.jpg', 'test2.jpg', 'test3.jpg'];
const THUMB_SIZE = 150;
let IMAGES = [];
let CELL_COLORS = ['#FF9A76', '#5B8DEF', '#43E97B'];

function getAverageColor(img) {
  const c = document.createElement('canvas');
  c.width = 8; c.height = 8;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, 8, 8);
  const d = ctx.getImageData(0, 0, 8, 8).data;
  let r = 0, g = 0, b = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; }
  const n = d.length / 4;
  return `rgb(${Math.round(r/n)},${Math.round(g/n)},${Math.round(b/n)})`;
}

function createThumbnail(src, idx) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      CELL_COLORS[idx] = getAverageColor(img);
      const canvas = document.createElement('canvas');
      canvas.width = THUMB_SIZE;
      canvas.height = THUMB_SIZE;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, THUMB_SIZE, THUMB_SIZE);
      canvas.toBlob(blob => {
        resolve(URL.createObjectURL(blob));
      }, 'image/jpeg', 0.6);
    };
    img.onerror = () => resolve(src);
    img.src = src;
  });
}

async function initImages() {
  const results = await Promise.all(IMAGE_FILES.map((f, i) => createThumbnail(f, i)));
  IMAGES = results;
}

// ===== 进度存储 =====
function getMaxLevel() {
  return parseInt(localStorage.getItem('match3_max_level') || '1');
}

function setMaxLevel(n) {
  const current = getMaxLevel();
  if (n > current) localStorage.setItem('match3_max_level', n);
}

// ===== 星级存储 =====
function getStars(level) {
  return parseInt(localStorage.getItem('match3_stars_' + level) || '0');
}

function setStars(level, stars) {
  const current = getStars(level);
  if (stars > current) localStorage.setItem('match3_stars_' + level, stars);
}

// ===== 地图渲染 (SVG蛇形路径) =====
function renderMap() {
  const maxLevel = getMaxLevel();
  document.getElementById('maxLevelText').textContent = `最高关卡: 第 ${maxLevel} 关`;

  const container = document.getElementById('mapPath');
  container.innerHTML = '';

  const TOTAL_LEVELS = 15;
  const COLS = 2;
  const NODE_SIZE = 56;
  const SPACING_Y = 80;
  const PADDING_X = 40;
  const containerWidth = container.clientWidth || 360;

  const positions = [];
  for (let i = 0; i < TOTAL_LEVELS; i++) {
    const col = Math.floor(i / 2) % 2 === 0 ? 0 : 1;
    const row = Math.floor(i / 2);
    // 蛇形：奇数行反转
    const x = col === 0 ? PADDING_X + NODE_SIZE / 2 : containerWidth - PADDING_X - NODE_SIZE / 2;
    const y = NODE_SIZE / 2 + 16 + row * SPACING_Y;
    positions.push({ x, y, row: row, col: (i % 2 === 0) ? 0 : 1 });
  }

  const totalHeight = positions[positions.length - 1].y + NODE_SIZE / 2 + 20;
  container.style.height = totalHeight + 'px';

  // SVG 路径
  let svgPath = '';
  for (let i = 1; i < TOTAL_LEVELS; i++) {
    const prev = positions[i - 1];
    const curr = positions[i];
    const cx1 = prev.x;
    const cy1 = (prev.y + curr.y) / 2;
    const cx2 = curr.x;
    const cy2 = (prev.y + curr.y) / 2;

    let pathStroke = '#d5d5da';
    const status = i < maxLevel ? 'done' : (i === maxLevel ? 'current' : 'locked');
    if (status === 'done') pathStroke = '#43e97b';
    else if (status === 'current') pathStroke = '#FF9A76';

    svgPath += `<path d="M${prev.x},${prev.y} C${cx1},${cy1} ${cx2},${cy2} ${curr.x},${curr.y}"
      stroke="${pathStroke}" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>`;
  }

  container.innerHTML = `<svg viewBox="0 0 ${containerWidth} ${totalHeight}" style="position:absolute;top:0;left:0;width:100%;height:${totalHeight}px;pointer-events:none;z-index:0">
    ${svgPath}
  </svg><div id="mapNodes" style="position:relative;z-index:1"></div>`;

  const nodesContainer = document.getElementById('mapNodes');

  for (let i = 0; i < TOTAL_LEVELS; i++) {
    const level = i + 1;
    let status;
    if (level < maxLevel) status = 'done';
    else if (level === maxLevel) status = 'current';
    else status = 'locked';

    let icon;
    if (status === 'done') icon = '✔';
    else if (status === 'current') icon = level;
    else icon = '🔒';

    const pos = positions[i];
    const node = document.createElement('div');
    node.className = `level-node ${status}`;
    node.style.left = (pos.x - NODE_SIZE / 2) + 'px';
    node.style.top = (pos.y - NODE_SIZE / 2) + 'px';

    let starsHtml = '';
    if (status === 'done') {
      const stars = getStars(level);
      starsHtml = '<div class="level-stars">' +
        [1,2,3].map(s => `<span class="level-star ${s <= stars ? 'filled' : ''}">★</span>`).join('') +
        '</div>';
    }

    node.innerHTML = `
      <div class="level-dot" data-level="${level}">${icon}</div>
      <div class="level-label">第 ${level} 关</div>
      ${starsHtml}
    `;

    const dot = node.querySelector('.level-dot');
    dot.addEventListener('click', () => {
      if (status === 'locked') return;
      startLevel(level);
    });

    nodesContainer.appendChild(node);
  }
}

// ===== 视图切换 =====
function showMap() {
  const gameView = document.getElementById('gameView');
  const mapView = document.getElementById('mapView');
  document.getElementById('overlayContainer').innerHTML = '';

  gameView.classList.add('hidden');
  setTimeout(() => {
    gameView.style.display = 'none';
    mapView.style.display = 'block';
    mapView.classList.add('fade-view');
    requestAnimationFrame(() => {
      mapView.classList.remove('hidden');
      renderMap();
    });
  }, 300);
}

function startLevel(n) {
  const mapView = document.getElementById('mapView');
  const gameView = document.getElementById('gameView');

  mapView.classList.add('hidden');
  setTimeout(() => {
    mapView.style.display = 'none';
    gameView.style.display = 'block';
    gameView.classList.add('fade-view');
    state.level = n;
    resetLevel();
    requestAnimationFrame(() => {
      gameView.classList.remove('hidden');
    });
  }, 300);
}

// ===== 游戏状态 =====
const ROWS = 6, COLS = 6;

let board = [];
let state = {
  level: 1,
  score: 0,
  target: 100,
  stepsLeft: 20,
  totalSteps: 20,
  comboCount: 0,
  gameStatus: 'idle',
};

// ===== 关卡配置 =====
function getLevelConfig(n) {
  if (n <= 9) {
    const targets = [100, 200, 350, 500, 700, 900, 1200, 1500, 1800];
    const steps = [20, 20, 18, 18, 16, 16, 15, 15, 14];
    return { target: targets[n - 1], steps: steps[n - 1] };
  }
  const target = 2000 + (n - 10) * 300;
  const steps = Math.max(10, 14 - Math.floor(n / 5));
  return { target, steps };
}

// ===== 棋盘初始化 =====
function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board[r] = [];
    for (let c = 0; c < COLS; c++) {
      let type;
      do {
        type = Math.floor(Math.random() * 3);
      } while (
        (c >= 2 && board[r][c - 1] === type && board[r][c - 2] === type) ||
        (r >= 2 && board[r - 1][c] === type && board[r - 2][c] === type)
      );
      board[r][c] = type;
    }
  }
}

function resetLevel() {
  const cfg = getLevelConfig(state.level);
  state.score = 0;
  state.target = cfg.target;
  state.stepsLeft = cfg.steps;
  state.totalSteps = cfg.steps;
  state.comboCount = 0;
  state.gameStatus = 'idle';
  initBoard();
  updateUI();
  renderBoard();
}

// ===== 渲染 =====
function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      const img = document.createElement('img');
      img.src = IMAGES[board[r][c]];
      img.draggable = false;
      cell.appendChild(img);
      cell.addEventListener('touchstart', handleTouchStart, { passive: true });
      boardEl.appendChild(cell);
    }
  }
}

function updateCellImage(r, c) {
  const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
  if (cell) {
    cell.querySelector('img').src = IMAGES[board[r][c]];
  }
}

function updateAllCells() {
  const cells = document.querySelectorAll('.cell');
  cells.forEach(cell => {
    const r = +cell.dataset.row;
    const c = +cell.dataset.col;
    cell.classList.remove('removing');
    cell.querySelector('img').src = IMAGES[board[r][c]];
  });
}

// ===== 触摸交互 =====
let touchStartRow = -1, touchStartCol = -1;
let touchStartX = 0, touchStartY = 0;
let isDragging = false;

function getCellFromTouch(touch) {
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  if (!el) return null;
  const cell = el.closest('.cell');
  if (!cell) return null;
  return { r: +cell.dataset.row, c: +cell.dataset.col };
}

function handleTouchStart(e) {
  if (state.gameStatus !== 'idle') return;
  const touch = e.touches[0];
  const cell = getCellFromTouch(touch);
  if (!cell) return;
  touchStartRow = cell.r;
  touchStartCol = cell.c;
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  isDragging = true;

  document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
  const cellEl = document.querySelector(`.cell[data-row="${cell.r}"][data-col="${cell.c}"]`);
  if (cellEl) cellEl.classList.add('selected');
}

function handleTouchMove(e) {
  e.preventDefault();
}

function handleTouchEnd(e) {
  if (!isDragging || state.gameStatus !== 'idle') return;
  isDragging = false;
  const touch = e.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;
  const threshold = 20;

  if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return;

  let dr = 0, dc = 0;
  if (Math.abs(dx) > Math.abs(dy)) {
    dc = dx > 0 ? 1 : -1;
  } else {
    dr = dy > 0 ? 1 : -1;
  }

  const r1 = touchStartRow, c1 = touchStartCol;
  const r2 = r1 + dr, c2 = c1 + dc;
  if (r2 < 0 || r2 >= ROWS || c2 < 0 || c2 >= COLS) return;

  executeSwap(r1, c1, r2, c2);
}

function swap(r1, c1, r2, c2) {
  const tmp = board[r1][c1];
  board[r1][c1] = board[r2][c2];
  board[r2][c2] = tmp;
}

function getCellEl(r, c) {
  return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
}

function addSwapAnimation(r1, c1, r2, c2) {
  const cell1 = getCellEl(r1, c1);
  const cell2 = getCellEl(r2, c2);
  if (!cell1 || !cell2) return;

  const rect1 = cell1.getBoundingClientRect();
  const rect2 = cell2.getBoundingClientRect();
  const dx = rect2.left - rect1.left;
  const dy = rect2.top - rect1.top;

  cell1.style.transition = 'transform 0.18s ease-in-out';
  cell2.style.transition = 'transform 0.18s ease-in-out';
  cell1.style.transform = `translate(${dx}px, ${dy}px)`;
  cell2.style.transform = `translate(${-dx}px, ${-dy}px)`;
  cell1.style.zIndex = '3';
  cell2.style.zIndex = '3';
}

function removeSwapAnimation(r1, c1, r2, c2) {
  const cell1 = getCellEl(r1, c1);
  const cell2 = getCellEl(r2, c2);
  if (!cell1 || !cell2) return;

  cell1.style.transition = 'none';
  cell2.style.transition = 'none';
  cell1.style.transform = '';
  cell2.style.transform = '';
  cell1.style.zIndex = '';
  cell2.style.zIndex = '';
  cell1.classList.remove('selected');
  cell2.classList.remove('selected');
}

// ===== 消除检测 =====
function findMatches() {
  const matched = new Set();

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      const type = board[r][c];
      if (type === -1) continue;
      let len = 1;
      while (c + len < COLS && board[r][c + len] === type) len++;
      if (len >= 3) {
        for (let i = 0; i < len; i++) matched.add(r * COLS + (c + i));
        c += len - 1;
      }
    }
  }

  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      const type = board[r][c];
      if (type === -1) continue;
      let len = 1;
      while (r + len < ROWS && board[r + len][c] === type) len++;
      if (len >= 3) {
        for (let i = 0; i < len; i++) matched.add((r + i) * COLS + c);
        r += len - 1;
      }
    }
  }

  return [...matched].map(idx => ({ r: Math.floor(idx / COLS), c: idx % COLS }));
}

function groupMatches(matchedCells) {
  const groups = [];
  const visited = new Set();

  for (const { r, c } of matchedCells) {
    const key = r * COLS + c;
    if (visited.has(key)) continue;

    const type = board[r][c];
    const group = [];
    const queue = [{ r, c }];
    visited.add(key);

    while (queue.length > 0) {
      const curr = queue.shift();
      group.push(curr);
      for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
        const nr = curr.r + dr, nc = curr.c + dc;
        const nk = nr * COLS + nc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS &&
            !visited.has(nk) && board[nr][nc] === type &&
            matchedCells.some(m => m.r === nr && m.c === nc)) {
          visited.add(nk);
          queue.push({ r: nr, c: nc });
        }
      }
    }
    groups.push(group);
  }
  return groups;
}

// ===== 重力 + 填充 =====
function applyGravity() {
  for (let c = 0; c < COLS; c++) {
    const column = [];
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][c] !== -1) column.push(board[r][c]);
    }
    for (let r = ROWS - 1; r >= 0; r--) {
      const idx = ROWS - 1 - r;
      board[r][c] = idx < column.length ? column[idx] : -1;
    }
  }
}

function fillBoard() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] === -1) {
        board[r][c] = Math.floor(Math.random() * 3);
      }
    }
  }
}

// ===== 工具函数 =====
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function showCombo(n) {
  const container = document.getElementById('comboContainer');
  const el = document.createElement('div');
  el.className = 'combo-popup';
  el.textContent = `COMBO ×${n}!`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

function getScoreForGroup(group) {
  const size = group.length;
  if (size >= 6) return 80;
  if (size === 5) return 40;
  if (size === 4) return 20;
  return 10;
}

function markRemovingCells(matches) {
  const cells = document.querySelectorAll('.cell');
  for (const { r, c } of matches) {
    const idx = r * COLS + c;
    if (idx < cells.length) cells[idx].classList.add('removing');
  }
}

async function executeSwap(r1, c1, r2, c2) {
  state.gameStatus = 'swapping';
  swap(r1, c1, r2, c2);

  addSwapAnimation(r1, c1, r2, c2);
  await sleep(180);
  updateCellImage(r1, c1);
  updateCellImage(r2, c2);
  removeSwapAnimation(r1, c1, r2, c2);

  const firstMatches = findMatches();
  if (firstMatches.length === 0) {
    await sleep(150);
    swap(r1, c1, r2, c2);

    addSwapAnimation(r1, c1, r2, c2);
    await sleep(180);
    updateCellImage(r1, c1);
    updateCellImage(r2, c2);
    removeSwapAnimation(r1, c1, r2, c2);

    state.stepsLeft--;
    updateUI();
    state.gameStatus = 'idle';
    checkGameState();
    return;
  }

  state.stepsLeft--;
  let combo = 0;

  while (true) {
    const matches = findMatches();
    if (matches.length === 0) break;

    combo++;
    const groups = groupMatches(matches);
    let turnScore = 0;
    for (const g of groups) turnScore += getScoreForGroup(g);
    turnScore *= combo;
    updateScore(turnScore);

    showComboTier(combo);
    for (const g of groups) {
      const mid = g[Math.floor(g.length / 2)];
      showScoreFloat(mid.r, mid.c, getScoreForGroup(g) * combo);
    }

    markRemovingCells(matches);
    await sleep(200);

    for (const { r, c } of matches) board[r][c] = -1;

    applyGravity();
    fillBoard();
    updateAllCells();
    await sleep(300);
  }

  updateUI();
  if (state.gameStatus === 'swapping') {
    state.gameStatus = 'idle';
  }
  checkGameState();
}

// ===== 死局检测 =====
function checkDeadlock() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c < COLS - 1) {
        swap(r, c, r, c + 1);
        const m = findMatches();
        swap(r, c, r, c + 1);
        if (m.length > 0) return false;
      }
      if (r < ROWS - 1) {
        swap(r, c, r + 1, c);
        const m = findMatches();
        swap(r, c, r + 1, c);
        if (m.length > 0) return false;
      }
    }
  }
  return true;
}

function showOverlay(icon, title, subtitle, btnText, onClick) {
  const container = document.getElementById('overlayContainer');
  container.innerHTML = `
    <div class="overlay">
      <div class="modal">
        <div class="icon">${icon}</div>
        <div class="title">${title}</div>
        <div class="subtitle">${subtitle}</div>
        <button id="modalBtn">${btnText}</button>
      </div>
    </div>
  `;
  document.getElementById('modalBtn').addEventListener('click', () => {
    container.innerHTML = '';
    onClick();
  });
}

function checkGameState() {
  if (state.score >= state.target) {
    state.gameStatus = 'win';
    const nextLevel = state.level + 1;
    setMaxLevel(nextLevel);

    // 计算星级
    const ratio = state.score / state.target;
    let stars = 1;
    if (ratio >= 2.2) stars = 3;
    else if (ratio >= 1.6) stars = 2;
    setStars(state.level, stars);

    const starsHtml = [1,2,3].map(s =>
      `<span class="star${s <= stars ? ' earned' : ' empty'}" style="animation-delay:${s*0.15}s">★</span>`
    ).join('');

    showOverlay('🎉', '恭喜过关！',
      `<div>第 ${state.level} 关完成</div><div class="stars-row">${starsHtml}</div><div style="font-size:12px;color:var(--text-secondary);margin-top:4px">得分: ${state.score}</div>`,
      '返回地图', () => { showMap(); });
    return;
  }

  if (state.stepsLeft <= 0) {
    state.gameStatus = 'lose';
    showOverlay('😢', '步数用完', `得分: ${state.score} / ${state.target}`, '重试本关', () => {
      resetLevel();
    });
    return;
  }

  if (checkDeadlock()) {
    state.gameStatus = 'lose';
    showOverlay('🔒', '死局！', `无可消除的方块，得分: ${state.score}`, '重试本关', () => {
      resetLevel();
    });
    return;
  }
}

function updateUI() {
  document.getElementById('levelTitle').textContent = `第 ${state.level} 关`;
  document.getElementById('scoreText').textContent = `分数: ${state.score} / ${state.target}`;
  document.getElementById('stepsText').textContent = `步数: ${state.stepsLeft}`;
  const pct = (state.stepsLeft / state.totalSteps) * 100;
  document.getElementById('stepsFill').style.width = pct + '%';
}

function updateScore(add) {
  state.score += add;
  updateUI();
}

// ===== 粒子系统 =====
function spawnParticles(cx, cy, color, count) {
  const canvas = document.getElementById('particleCanvas');
  const rect = canvas.getBoundingClientRect();
  const ctx = canvas.getContext('2d');

  canvas.width = rect.width * (devicePixelRatio || 1);
  canvas.height = rect.height * (devicePixelRatio || 1);
  ctx.scale(devicePixelRatio || 1, 1);

  const particles = [];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 60 + Math.random() * 140;
    particles.push({
      x: cx * rect.width,
      y: cy * rect.height,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 30,
      life: 1,
      decay: 1.2 + Math.random() * 1.8,
      size: 3 + Math.random() * 4,
      color: color,
    });
  }

  let animId;
  function animate(ts) {
    ctx.clearRect(0, 0, rect.width, rect.height);
    let alive = false;
    for (const p of particles) {
      p.x += p.vx * 0.016;
      p.y += p.vy * 0.016;
      p.vy += 120 * 0.016;
      p.life -= p.decay * 0.016;
      if (p.life <= 0) continue;
      alive = true;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (alive) animId = requestAnimationFrame(animate);
  }
  animId = requestAnimationFrame(animate);
}

function spawnMatchParticles(matches) {
  const boardEl = document.getElementById('board');
  const boardRect = boardEl.getBoundingClientRect();
  const canvas = document.getElementById('particleCanvas');
  const canvasRect = canvas.getBoundingClientRect();

  for (const { r, c } of matches) {
    const type = boardEl.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
    if (!type) continue;
    const color = CELL_COLORS[board[r][c]] || '#FF6B6B';
    const cellSize = boardRect.width / COLS;
    const cx = (c * cellSize + cellSize / 2 - canvasRect.left) / canvasRect.width;
    const cy = (r * cellSize + cellSize / 2 - canvasRect.top) / canvasRect.height;
    spawnParticles(cx, cy, color, 8);
  }
}

// ===== 得分上浮 =====
function showScoreFloat(r, c, points) {
  const boardEl = document.getElementById('board');
  const cells = boardEl.querySelectorAll('.cell');
  const idx = r * COLS + c;
  if (idx >= cells.length) return;
  const cell = cells[idx];
  const rect = cell.getBoundingClientRect();

  const el = document.createElement('div');
  el.className = 'score-float';
  el.textContent = '+' + points;
  el.style.left = rect.left + rect.width / 2 - 20 + 'px';
  el.style.top = rect.top + 'px';
  document.getElementById('scoreFloatContainer').appendChild(el);
  setTimeout(() => el.remove(), 900);
}

// ===== Combo 分级 =====
const COMBO_TIERS = [
  { min: 2, text: 'Nice!', color: '#FF9A76' },
  { min: 3, text: 'Great!', color: '#FF6B6B' },
  { min: 4, text: 'Excellent!', color: '#FF4757' },
  { min: 5, text: 'Amazing!', color: '#9B7BFF' },
  { min: 6, text: 'Perfect!', color: '#FF6B6B' },
  { min: 8, text: 'Unbelievable!', color: '#FF4757' },
];

function showComboTier(combo) {
  let tier = null;
  for (const t of COMBO_TIERS) {
    if (combo >= t.min) tier = t;
  }
  if (!tier) return;

  const container = document.getElementById('comboContainer');
  const el = document.createElement('div');
  el.className = 'combo-popup';
  el.textContent = tier.text;
  el.style.color = tier.color;
  el.style.textShadow = `0 2px 16px ${tier.color}40`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

// ===== 胜利粒子雨 =====
function spawnWinConfetti() {
  const colors = ['#FF6B6B', '#FF9A76', '#FFD93D', '#6BCB77', '#4D96FF', '#9B7BFF'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'win-particle';
      el.style.left = Math.random() * 100 + '%';
      el.style.top = -(10 + Math.random() * 30) + 'px';
      el.style.width = (6 + Math.random() * 8) + 'px';
      el.style.height = (6 + Math.random() * 10) + 'px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (1 + Math.random() * 1.5) + 's';
      el.style.animationDelay = '0s';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }, i * 20);
  }
}

// ===== 失败特效 =====
function triggerLoseEffect() {
  const boardEl = document.getElementById('board');
  boardEl.classList.add('shake', 'grayout');
  setTimeout(() => {
    boardEl.classList.remove('shake', 'grayout');
  }, 600);
}

// ===== 增强 markRemovingCells 加粒子 =====
const _markRemovingCells = markRemovingCells;
markRemovingCells = function(matches) {
  _markRemovingCells(matches);
  spawnMatchParticles(matches);
};

// ===== 增强 updateAllCells 加掉落弹跳 =====
const _updateAllCells = updateAllCells;
updateAllCells = function() {
  _updateAllCells();
  const cells = document.querySelectorAll('.board .cell');
  cells.forEach(c => {
    c.classList.add('drop-in');
    c.addEventListener('animationend', () => c.classList.remove('drop-in'), { once: true });
  });
};

// ===== 增强 showOverlay 加输赢特效 =====
const _showOverlay = showOverlay;
showOverlay = function(icon, title, subtitle, btnText, onClick) {
  if (title === '恭喜过关！') spawnWinConfetti();
  if (title === '步数用完' || title === '死局！') triggerLoseEffect();
  _showOverlay(icon, title, subtitle, btnText, onClick);
};

document.getElementById('board').addEventListener('touchmove', handleTouchMove, { passive: false });
document.getElementById('board').addEventListener('touchend', handleTouchEnd);

(async function boot() {
  document.getElementById('mapPath').innerHTML = '<div style="text-align:center;color:#999;padding:40px">加载中...</div>';
  await initImages();
  renderMap();
})();
