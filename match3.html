<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>图片消消乐</title>
<style>
/* ================================================================
   GAME UI DESIGN SYSTEM - "Candy Night"
   ================================================================ */
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: "MiSans","HarmonyOS Sans","PingFang SC",system-ui,sans-serif;
  background: #0f0823;
  min-height: 100dvh;
  display: flex; justify-content: center; align-items: center;
  overflow-x: hidden;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* ---- 深空背景 ---- */
.bg-space {
  position: fixed; inset:0; z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 30% 5%, #1a1050 0%, transparent 55%),
    radial-gradient(ellipse 50% 60% at 75% 25%, #0d1a3e 0%, transparent 50%),
    radial-gradient(ellipse 60% 50% at 40% 75%, #2a1050 0%, transparent 55%),
    radial-gradient(ellipse 100% 100% at 50% 50%, #0a0418 0%, #060310 100%);
}

/* 星点 */
.bg-stars {
  position: fixed; inset:0; z-index:0;
  background-image:
    radial-gradient(1px 1px at 12% 8%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 25% 18%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 38% 5%, rgba(255,255,255,.8), transparent),
    radial-gradient(1px 1px at 52% 14%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 65% 9%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 78% 22%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 88% 12%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 15% 28%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 42% 35%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 58% 32%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 72% 38%, rgba(255,255,255,.3), transparent),
    radial-gradient(1.5px 1.5px at 8% 48%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 32% 55%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 55% 58%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 80% 52%, rgba(255,255,255,.3), transparent),
    radial-gradient(1.5px 1.5px at 18% 68%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 45% 72%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 68% 65%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 85% 75%, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 22% 82%, rgba(255,255,255,.5), transparent);
}

/* 光晕 */
.glow-orb {
  position: fixed; border-radius:50%; pointer-events:none; z-index:0; filter:blur(90px);
}
.glow-orb.purple { width:260px; height:260px; background:#7c3aed; opacity:.22; top:-80px; left:-60px; }
.glow-orb.blue   { width:200px; height:200px; background:#3b82f6; opacity:.18; top:45%; right:-60px; }
.glow-orb.pink   { width:220px; height:220px; background:#ec4899; opacity:.16; bottom:-60px; left:25%; }

/* =============================================================
   SHARED
   ============================================================= */
.fade-view {
  transition: opacity .3s ease, transform .3s ease;
}
.fade-view.hidden {
  opacity:0; transform:translateY(10px); pointer-events:none;
}

.back-pill {
  display: inline-flex; align-items:center; gap:4px;
  padding: 8px 16px; border-radius: 50px;
  font-size:13px; font-weight:700; letter-spacing:.5px;
  color: rgba(255,255,255,.65);
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  cursor: pointer;
  transition: all .2s ease;
  margin-bottom: 8px;
}
.back-pill:active { background: rgba(255,255,255,.14); color:#fff; }

/* =============================================================
   MAP VIEW
   ============================================================= */
.map-container {
  width:100%; max-width:420px; padding:16px;
  position:relative; z-index:2;
}

.map-header-block {
  text-align: center;
  padding: 20px 0 8px;
}

.map-game-icon {
  width: 64px; height: 64px;
  margin: 0 auto 12px;
  background: linear-gradient(135deg, rgba(168,85,247,.3), rgba(236,72,153,.2));
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 20px;
  display: flex; align-items:center; justify-content:center;
  font-size: 30px;
  box-shadow: 0 8px 24px rgba(168,85,247,.18);
}

.map-game-title {
  font-size: 26px; font-weight:900; letter-spacing: 1px;
  background: linear-gradient(180deg, #fff 30%, #c4b5fd 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}

.map-game-sub {
  font-size:12px; color:rgba(255,255,255,.4); letter-spacing:2px; margin-top:2px;
}

/* 地图滚动区 */
.map-scroll {
  position:relative;
  margin: 12px 0;
  border-radius: 20px;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.06);
  max-height: 55vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.map-path {
  position:relative;
  min-height: 300px;
}

/* 关卡节点 */
.level-node {
  position: absolute;
  display: flex; flex-direction:column; align-items:center;
  z-index: 1;
}

.level-dot {
  width: 48px; height: 48px;
  border-radius: 50%;
  display: flex; align-items:center; justify-content:center;
  font-size: 15px; font-weight:900; color: #fff;
  cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease;
  position: relative;
}

.level-dot:active { transform: scale(.9); }

/* 已完成 */
.level-node.done .level-dot {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  box-shadow: 0 0 0 5px rgba(34,197,94,.2);
}
/* 当前 */
.level-node.current .level-dot {
  width: 54px; height: 54px;
  font-size: 20px;
  background: linear-gradient(135deg, #f59e0b, #f97316);
  box-shadow: 0 0 0 8px rgba(245,158,11,.2), 0 0 28px rgba(245,158,11,.25);
  animation: nodePulse 1.8s ease-in-out infinite;
}
/* 锁定 */
.level-node.locked .level-dot {
  background: #334155;
  color: #64748b;
  cursor: default;
}

@keyframes nodePulse {
  0%,100% { box-shadow: 0 0 0 8px rgba(245,158,11,.2), 0 0 28px rgba(245,158,11,.25); }
  50%      { box-shadow: 0 0 0 14px rgba(245,158,11,.06), 0 0 40px rgba(245,158,11,.15); }
}

.level-label {
  font-size: 11px; font-weight:700; margin-top: 5px;
  color: rgba(255,255,255,.5); letter-spacing: .5px;
}
.level-node.current .level-label { color: #fbbf24; }

.level-stars {
  display: flex; gap: 2px; margin-top: 2px; font-size: 10px;
}
.level-star { color: rgba(255,255,255,.15); }
.level-star.filled { color: #fbbf24; }

/* 地图底部提示 */
.map-tip {
  text-align: center;
  font-size: 12px; color: rgba(255,255,255,.3);
  letter-spacing: .5px; line-height: 1.8;
  padding: 12px 20px 4px;
}

/* =============================================================
   GAME VIEW
   ============================================================= */
.game-view {
  width:100%; max-width:420px; padding:14px;
  position:relative; z-index:2;
}

/* HUD 顶部栏 */
.hud-top {
  display: flex; align-items:center; gap: 10px;
  margin-bottom: 10px;
}

.hud-pill {
  flex:1;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  text-align: center;
}

.hud-pill .hud-label {
  font-size: 10px; font-weight:700;
  color: rgba(255,255,255,.35); letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 2px;
}

.hud-pill .hud-value {
  font-size: 18px; font-weight:900;
  color: #fff; letter-spacing: .5px;
}

.hud-pill.level-pill { border-color: rgba(168,85,247,.25); }
.hud-pill.score-pill { border-color: rgba(59,130,246,.25); }
.hud-pill.steps-pill { border-color: rgba(245,158,11,.25); }

/* 步数进度条 */
.steps-bar-wrap {
  margin-bottom: 12px;
  height: 5px; border-radius: 3px;
  background: rgba(255,255,255,.06);
  overflow: hidden;
}
.steps-fill {
  height: 100%; border-radius:3px;
  background: linear-gradient(90deg, #f97316, #fbbf24);
  transition: width .4s ease;
}

/* 棋盘 */
.board-wrapper {
  position: relative;
  border-radius: 20px;
  padding: 10px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 16px 48px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
}

.board {
  display: grid;
  grid-template-columns: repeat(6,1fr);
  grid-template-rows: repeat(6,1fr);
  gap: 4px;
  border-radius: 14px;
  touch-action: none;
}

/* 棋子 */
.cell {
  aspect-ratio: 1;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  transition: transform .18s ease-in-out, opacity .2s ease, box-shadow .2s ease;
  box-shadow: 0 3px 8px rgba(0,0,0,.25);
}

.cell img { width:100%; height:100%; object-fit:cover; display:block; }

.cell.selected {
  transform: scale(1.07);
  box-shadow: 0 0 0 3px #a78bfa, 0 4px 16px rgba(139,92,246,.4);
  z-index:2;
}

.cell.swapping { opacity: .45; transform: scale(.88); }
.cell.removing  { opacity: 0; transform: scale(.25) rotate(12deg); }

#particleCanvas {
  position: absolute; top:0; left:0;
  width:100%; height:100%;
  pointer-events:none; z-index:3;
}

/* =============================================================
   ANIMATIONS
   ============================================================= */
@keyframes dropBounce {
  0%   { transform: translateY(-60px); opacity: 0; }
  45%  { transform: translateY(6px); opacity: 1; }
  65%  { transform: translateY(-4px); }
  80%  { transform: translateY(2px); }
  100% { transform: translateY(0); }
}
.cell.drop-in { animation: dropBounce .4s ease-out forwards; }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  15% { transform: translateX(-8px); }
  30% { transform: translateX(8px); }
  45% { transform: translateX(-5px); }
  60% { transform: translateX(5px); }
  75% { transform: translateX(-2px); }
}
.board.shake { animation: shake .5s ease-out; }
.board.grayout { filter: grayscale(1) brightness(.55); transition: filter .4s ease; }

/* Combo 弹出 */
.combo-popup {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  font-size: 38px; font-weight:900; letter-spacing:-.5px;
  pointer-events: none; z-index:20;
  animation: comboIn .7s ease-out forwards;
}
@keyframes comboIn {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(.2); }
  35%  { opacity:1; transform:translate(-50%,-50%) scale(1.15); }
  100% { opacity:0; transform:translate(-50%,-60%) scale(1); }
}

/* 得分数值 */
.score-float {
  position: fixed;
  pointer-events:none; z-index:20;
  font-size: 18px; font-weight:900;
  color: #fbbf24;
  text-shadow: 0 1px 4px rgba(0,0,0,.3);
  animation: floatUp .9s ease-out forwards;
}
@keyframes floatUp {
  0%   { opacity:1; transform:translateY(0) scale(1); }
  100% { opacity:0; transform:translateY(-48px) scale(1.15); }
}

/* 胜利纸屑 */
.win-particle {
  position: fixed; pointer-events:none; z-index:150; border-radius:3px;
  animation: confettiFall 1.3s ease-out forwards;
}
@keyframes confettiFall {
  0%   { opacity:1; transform:translateY(0) rotate(0deg) scale(1); }
  100% { opacity:0; transform:translateY(110vh) rotate(720deg) scale(.25); }
}

/* =============================================================
   MODALS
   ============================================================= */
.overlay {
  position: fixed; inset:0; z-index:100;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex; justify-content:center; align-items:center;
}

.modal {
  width: 290px;
  padding: 34px 24px 26px;
  border-radius: 24px;
  text-align: center;
  background: rgba(30,20,60,.9);
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 24px 56px rgba(0,0,0,.5);
}

.modal .icon { font-size: 48px; margin-bottom: 10px; }

.modal .title {
  font-size: 22px; font-weight:900; letter-spacing:.5px;
  color: #fff;
  margin-bottom: 6px;
}

.modal .subtitle {
  font-size: 13px; color: rgba(255,255,255,.5);
  margin-bottom: 22px; line-height: 1.6;
}

.modal button {
  width: 100%; padding: 15px;
  border: none; border-radius: 16px;
  font-size: 16px; font-weight:800; letter-spacing:1px;
  color: #fff;
  background: linear-gradient(180deg, #a78bfa, #7c3aed);
  box-shadow: 0 6px 0 #5b21b6, 0 8px 20px rgba(124,58,237,.35);
  cursor: pointer;
  transition: transform .1s ease, box-shadow .1s ease;
  position: relative;
}
.modal button:active {
  transform: translateY(3px);
  box-shadow: 0 3px 0 #5b21b6, 0 4px 12px rgba(124,58,237,.25);
}

/* 星级 */
.stars-row { display:flex; justify-content:center; gap:8px; margin: 8px 0 4px; }
.star { font-size: 28px; transition: transform .3s ease, opacity .3s ease; }
.star.empty { opacity:.2; filter:grayscale(1); }
.star.earned {
  animation: starPop .4s ease-out forwards;
  color: #fbbf24;
}
@keyframes starPop {
  0% { transform:scale(0); }
  60% { transform:scale(1.35); }
  100% { transform:scale(1); }
}
</style>
</head>
<body>

<div class="bg-space"></div>
<div class="bg-stars"></div>
<div class="glow-orb purple"></div>
<div class="glow-orb blue"></div>
<div class="glow-orb pink"></div>

<!-- ========== 关卡地图 ========== -->
<div class="map-container fade-view" id="mapView">
  <div class="back-pill" onclick="location.href='index.html'">
    ← 大厅
  </div>
  <div class="map-header-block">
    <div class="map-game-icon">🧩</div>
    <div class="map-game-title">图片消消乐</div>
    <div class="map-game-sub" id="maxLevelText">最高关卡: 第 1 关</div>
  </div>
  <div class="map-scroll">
    <div class="map-path" id="mapPath"></div>
  </div>
  <div class="map-tip">
    交换相邻图片，三个相连即可消除<br>达成目标分数过关
  </div>
</div>

<!-- ========== 游戏界面 ========== -->
<div class="game-view" id="gameView" style="display:none">
  <div class="back-pill" onclick="showMap()">
    ← 关卡地图
  </div>

  <div class="hud-top">
    <div class="hud-pill level-pill">
      <div class="hud-label">关卡</div>
      <div class="hud-value" id="levelTitle">1</div>
    </div>
    <div class="hud-pill score-pill">
      <div class="hud-label">得分</div>
      <div class="hud-value" id="scoreText">0</div>
    </div>
    <div class="hud-pill steps-pill">
      <div class="hud-label">步数</div>
      <div class="hud-value" id="stepsText">20</div>
    </div>
  </div>

  <div class="steps-bar-wrap">
    <div class="steps-fill" id="stepsFill" style="width:100%"></div>
  </div>

  <div class="board-wrapper">
    <div class="board" id="board"></div>
    <canvas id="particleCanvas"></canvas>
  </div>
</div>

<div id="overlayContainer"></div>
<div id="comboContainer"></div>
<div id="scoreFloatContainer"></div>

<script>
// ===== 图片缩略图生成 + 取色 =====
const IMAGE_FILES = ['test1.jpg', 'test2.jpg', 'test3.jpg'];
const THUMB_SIZE = 150;
let IMAGES = [];
let CELL_COLORS = ['#FF9A76', '#5B8DEF', '#43E97B'];

function getAverageColor(img) {
  const c = document.createElement('canvas');
  c.width = 8; c.height = 8;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, 8, 8);
  const d = ctx.getImageData(0, 0, 8, 8).data;
  let r = 0, g = 0, b = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; }
  const n = d.length / 4;
  return `rgb(${Math.round(r/n)},${Math.round(g/n)},${Math.round(b/n)})`;
}

function createThumbnail(src, idx) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      CELL_COLORS[idx] = getAverageColor(img);
      const canvas = document.createElement('canvas');
      canvas.width = THUMB_SIZE;
      canvas.height = THUMB_SIZE;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, THUMB_SIZE, THUMB_SIZE);
      canvas.toBlob(blob => {
        resolve(URL.createObjectURL(blob));
      }, 'image/jpeg', 0.6);
    };
    img.onerror = () => resolve(src);
    img.src = src;
  });
}

async function initImages() {
  const results = await Promise.all(IMAGE_FILES.map((f, i) => createThumbnail(f, i)));
  IMAGES = results;
}

// ===== 进度存储 =====
function getMaxLevel() {
  return parseInt(localStorage.getItem('match3_max_level') || '1');
}

function setMaxLevel(n) {
  const current = getMaxLevel();
  if (n > current) localStorage.setItem('match3_max_level', n);
}

// ===== 星级存储 =====
function getStars(level) {
  return parseInt(localStorage.getItem('match3_stars_' + level) || '0');
}

function setStars(level, stars) {
  const current = getStars(level);
  if (stars > current) localStorage.setItem('match3_stars_' + level, stars);
}

// ===== 地图渲染 (SVG蛇形路径) =====
function renderMap() {
  const maxLevel = getMaxLevel();
  document.getElementById('maxLevelText').textContent = `最高关卡: 第 ${maxLevel} 关`;

  const container = document.getElementById('mapPath');
  container.innerHTML = '';

  const TOTAL_LEVELS = 15;
  const NODE_SIZE = 56;
  const SPACING_Y = 100;
  const PADDING_X = 50;
  const containerWidth = Math.max(container.clientWidth, 320);

  const positions = [];
  for (let i = 0; i < TOTAL_LEVELS; i++) {
    const row = Math.floor(i / 2);
    const isEvenRow = row % 2 === 0;
    const isLeft = i % 2 === 0;
    const x = (isEvenRow === isLeft)
      ? PADDING_X + NODE_SIZE / 2
      : containerWidth - PADDING_X - NODE_SIZE / 2;
    const y = NODE_SIZE / 2 + 16 + row * SPACING_Y;
    positions.push({ x, y });
  }

  const totalHeight = positions[positions.length - 1].y + NODE_SIZE / 2 + 20;
  container.style.height = totalHeight + 'px';

  let svgPath = '';
  for (let i = 1; i < TOTAL_LEVELS; i++) {
    const prev = positions[i - 1];
    const curr = positions[i];
    const cx1 = prev.x;
    const cy1 = (prev.y + curr.y) / 2;
    const cx2 = curr.x;
    const cy2 = (prev.y + curr.y) / 2;

    let pathStroke = '#334155';
    const status = i < maxLevel ? 'done' : (i === maxLevel ? 'current' : 'locked');
    if (status === 'done') pathStroke = '#22c55e';
    else if (status === 'current') pathStroke = '#f59e0b';

    svgPath += `<path d="M${prev.x},${prev.y} C${cx1},${cy1} ${cx2},${cy2} ${curr.x},${curr.y}"
      stroke="${pathStroke}" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>`;
  }

  container.innerHTML = `<svg viewBox="0 0 ${containerWidth} ${totalHeight}" style="position:absolute;top:0;left:0;width:100%;height:${totalHeight}px;pointer-events:none;z-index:0">
    ${svgPath}
  </svg><div id="mapNodes" style="position:relative;z-index:1"></div>`;

  const nodesContainer = document.getElementById('mapNodes');

  for (let i = 0; i < TOTAL_LEVELS; i++) {
    const level = i + 1;
    let status;
    if (level < maxLevel) status = 'done';
    else if (level === maxLevel) status = 'current';
    else status = 'locked';

    let icon;
    if (status === 'done') icon = '✔';
    else if (status === 'current') icon = level;
    else icon = '🔒';

    const pos = positions[i];
    const node = document.createElement('div');
    node.className = `level-node ${status}`;
    node.style.left = (pos.x - NODE_SIZE / 2) + 'px';
    node.style.top = (pos.y - NODE_SIZE / 2) + 'px';

    let starsHtml = '';
    if (status === 'done') {
      const stars = getStars(level);
      starsHtml = '<div class="level-stars">' +
        [1,2,3].map(s => `<span class="level-star ${s <= stars ? 'filled' : ''}">★</span>`).join('') +
        '</div>';
    }

    node.innerHTML = `
      <div class="level-dot" data-level="${level}">${icon}</div>
      <div class="level-label">第 ${level} 关</div>
      ${starsHtml}
    `;

    const dot = node.querySelector('.level-dot');
    dot.addEventListener('click', () => {
      if (status === 'locked') return;
      startLevel(level);
    });

    nodesContainer.appendChild(node);
  }
}

// ===== 视图切换 =====
function showMap() {
  const gameView = document.getElementById('gameView');
  const mapView = document.getElementById('mapView');
  document.getElementById('overlayContainer').innerHTML = '';

  gameView.classList.add('hidden');
  setTimeout(() => {
    gameView.style.display = 'none';
    mapView.style.display = 'block';
    mapView.classList.add('fade-view');
    requestAnimationFrame(() => {
      mapView.classList.remove('hidden');
      renderMap();
    });
  }, 300);
}

function startLevel(n) {
  const mapView = document.getElementById('mapView');
  const gameView = document.getElementById('gameView');

  mapView.classList.add('hidden');
  setTimeout(() => {
    mapView.style.display = 'none';
    gameView.style.display = 'block';
    gameView.classList.add('fade-view');
    state.level = n;
    resetLevel();
    requestAnimationFrame(() => {
      gameView.classList.remove('hidden');
    });
  }, 300);
}

// ===== 游戏状态 =====
const ROWS = 6, COLS = 6;

let board = [];
let state = {
  level: 1,
  score: 0,
  target: 100,
  stepsLeft: 20,
  totalSteps: 20,
  comboCount: 0,
  gameStatus: 'idle',
};

// ===== 关卡配置 =====
function getLevelConfig(n) {
  if (n <= 9) {
    const targets = [100, 200, 350, 500, 700, 900, 1200, 1500, 1800];
    const steps = [20, 20, 18, 18, 16, 16, 15, 15, 14];
    return { target: targets[n - 1], steps: steps[n - 1] };
  }
  const target = 2000 + (n - 10) * 300;
  const steps = Math.max(10, 14 - Math.floor(n / 5));
  return { target, steps };
}

// ===== 棋盘初始化 =====
function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board[r] = [];
    for (let c = 0; c < COLS; c++) {
      let type;
      do {
        type = Math.floor(Math.random() * 3);
      } while (
        (c >= 2 && board[r][c - 1] === type && board[r][c - 2] === type) ||
        (r >= 2 && board[r - 1][c] === type && board[r - 2][c] === type)
      );
      board[r][c] = type;
    }
  }
}

function resetLevel() {
  const cfg = getLevelConfig(state.level);
  state.score = 0;
  state.target = cfg.target;
  state.stepsLeft = cfg.steps;
  state.totalSteps = cfg.steps;
  state.comboCount = 0;
  state.gameStatus = 'idle';
  initBoard();
  updateUI();
  renderBoard();
}

// ===== 渲染 =====
function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      const img = document.createElement('img');
      img.src = IMAGES[board[r][c]];
      img.draggable = false;
      cell.appendChild(img);
      cell.addEventListener('touchstart', handleTouchStart, { passive: true });
      boardEl.appendChild(cell);
    }
  }
}

function updateCellImage(r, c) {
  const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
  if (cell) {
    cell.querySelector('img').src = IMAGES[board[r][c]];
  }
}

function updateAllCells() {
  const cells = document.querySelectorAll('.cell');
  cells.forEach(cell => {
    const r = +cell.dataset.row;
    const c = +cell.dataset.col;
    cell.classList.remove('removing');
    cell.querySelector('img').src = IMAGES[board[r][c]];
  });
}

// ===== 触摸交互 =====
let touchStartRow = -1, touchStartCol = -1;
let touchStartX = 0, touchStartY = 0;
let isDragging = false;

function getCellFromTouch(touch) {
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  if (!el) return null;
  const cell = el.closest('.cell');
  if (!cell) return null;
  return { r: +cell.dataset.row, c: +cell.dataset.col };
}

function handleTouchStart(e) {
  if (state.gameStatus !== 'idle') return;
  const touch = e.touches[0];
  const cell = getCellFromTouch(touch);
  if (!cell) return;
  touchStartRow = cell.r;
  touchStartCol = cell.c;
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  isDragging = true;

  document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
  const cellEl = document.querySelector(`.cell[data-row="${cell.r}"][data-col="${cell.c}"]`);
  if (cellEl) cellEl.classList.add('selected');
}

function handleTouchEnd(e) {
  if (!isDragging || state.gameStatus !== 'idle') return;
  isDragging = false;
  const touch = e.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;
  const threshold = 20;

  if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return;

  let dr = 0, dc = 0;
  if (Math.abs(dx) > Math.abs(dy)) {
    dc = dx > 0 ? 1 : -1;
  } else {
    dr = dy > 0 ? 1 : -1;
  }

  const r1 = touchStartRow, c1 = touchStartCol;
  const r2 = r1 + dr, c2 = c1 + dc;
  if (r2 < 0 || r2 >= ROWS || c2 < 0 || c2 >= COLS) return;

  executeSwap(r1, c1, r2, c2);
}

function swap(r1, c1, r2, c2) {
  const tmp = board[r1][c1];
  board[r1][c1] = board[r2][c2];
  board[r2][c2] = tmp;
}

function getCellEl(r, c) {
  return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
}

function addSwapAnimation(r1, c1, r2, c2) {
  const cell1 = getCellEl(r1, c1);
  const cell2 = getCellEl(r2, c2);
  if (!cell1 || !cell2) return;

  const rect1 = cell1.getBoundingClientRect();
  const rect2 = cell2.getBoundingClientRect();
  const dx = rect2.left - rect1.left;
  const dy = rect2.top - rect1.top;

  cell1.style.transition = 'transform 0.18s ease-in-out';
  cell2.style.transition = 'transform 0.18s ease-in-out';
  cell1.style.transform = `translate(${dx}px, ${dy}px)`;
  cell2.style.transform = `translate(${-dx}px, ${-dy}px)`;
  cell1.style.zIndex = '3';
  cell2.style.zIndex = '3';
}

async function animateSwapCells(r1, c1, r2, c2) {
  addSwapAnimation(r1, c1, r2, c2);
  await sleep(180);
  updateCellImage(r1, c1);
  updateCellImage(r2, c2);
  removeSwapAnimation(r1, c1, r2, c2);
}

function removeSwapAnimation(r1, c1, r2, c2) {
  const cell1 = getCellEl(r1, c1);
  const cell2 = getCellEl(r2, c2);
  if (!cell1 || !cell2) return;

  cell1.style.transition = 'none';
  cell2.style.transition = 'none';
  cell1.style.transform = '';
  cell2.style.transform = '';
  cell1.style.zIndex = '';
  cell2.style.zIndex = '';
  cell1.classList.remove('selected');
  cell2.classList.remove('selected');
}

// ===== 消除检测 =====
function findMatches() {
  const matched = new Set();

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      const type = board[r][c];
      if (type === -1) continue;
      let len = 1;
      while (c + len < COLS && board[r][c + len] === type) len++;
      if (len >= 3) {
        for (let i = 0; i < len; i++) matched.add(r * COLS + (c + i));
        c += len - 1;
      }
    }
  }

  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      const type = board[r][c];
      if (type === -1) continue;
      let len = 1;
      while (r + len < ROWS && board[r + len][c] === type) len++;
      if (len >= 3) {
        for (let i = 0; i < len; i++) matched.add((r + i) * COLS + c);
        r += len - 1;
      }
    }
  }

  return [...matched].map(idx => ({ r: Math.floor(idx / COLS), c: idx % COLS }));
}

function groupMatches(matchedCells) {
  const groups = [];
  const visited = new Set();

  for (const { r, c } of matchedCells) {
    const key = r * COLS + c;
    if (visited.has(key)) continue;

    const type = board[r][c];
    const group = [];
    const queue = [{ r, c }];
    visited.add(key);

    while (queue.length > 0) {
      const curr = queue.shift();
      group.push(curr);
      for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
        const nr = curr.r + dr, nc = curr.c + dc;
        const nk = nr * COLS + nc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS &&
            !visited.has(nk) && board[nr][nc] === type &&
            matchedCells.some(m => m.r === nr && m.c === nc)) {
          visited.add(nk);
          queue.push({ r: nr, c: nc });
        }
      }
    }
    groups.push(group);
  }
  return groups;
}

// ===== 重力 + 填充 =====
function applyGravity() {
  for (let c = 0; c < COLS; c++) {
    const column = [];
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][c] !== -1) column.push(board[r][c]);
    }
    for (let r = ROWS - 1; r >= 0; r--) {
      const idx = ROWS - 1 - r;
      board[r][c] = idx < column.length ? column[idx] : -1;
    }
  }
}

function fillBoard() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] === -1) {
        board[r][c] = Math.floor(Math.random() * 3);
      }
    }
  }
}

// ===== 工具函数 =====
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function getScoreForGroup(group) {
  const size = group.length;
  if (size >= 6) return 80;
  if (size === 5) return 40;
  if (size === 4) return 20;
  return 10;
}

function markRemovingCells(matches) {
  const cells = document.querySelectorAll('.cell');
  for (const { r, c } of matches) {
    const idx = r * COLS + c;
    if (idx < cells.length) cells[idx].classList.add('removing');
  }
}

async function executeSwap(r1, c1, r2, c2) {
  state.gameStatus = 'swapping';
  swap(r1, c1, r2, c2);
  await animateSwapCells(r1, c1, r2, c2);

  const firstMatches = findMatches();
  if (firstMatches.length === 0) {
    await sleep(150);
    swap(r1, c1, r2, c2);
    await animateSwapCells(r1, c1, r2, c2);

    state.stepsLeft--;
    updateUI();
    state.gameStatus = 'idle';
    checkGameState();
    return;
  }

  state.stepsLeft--;
  let combo = 0;

  while (true) {
    const matches = findMatches();
    if (matches.length === 0) break;

    combo++;
    const groups = groupMatches(matches);
    let turnScore = 0;
    for (const g of groups) turnScore += getScoreForGroup(g);
    turnScore *= combo;
    updateScore(turnScore);

    showComboTier(combo);
    for (const g of groups) {
      const mid = g[Math.floor(g.length / 2)];
      showScoreFloat(mid.r, mid.c, getScoreForGroup(g) * combo);
    }

    markRemovingCells(matches);
    await sleep(200);

    for (const { r, c } of matches) board[r][c] = -1;

    applyGravity();
    fillBoard();
    updateAllCells();
    await sleep(300);
  }

  updateUI();
  if (state.gameStatus === 'swapping') {
    state.gameStatus = 'idle';
  }
  checkGameState();
}

// ===== 死局检测 =====
function checkDeadlock() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c < COLS - 1) {
        swap(r, c, r, c + 1);
        const m = findMatches();
        swap(r, c, r, c + 1);
        if (m.length > 0) return false;
      }
      if (r < ROWS - 1) {
        swap(r, c, r + 1, c);
        const m = findMatches();
        swap(r, c, r + 1, c);
        if (m.length > 0) return false;
      }
    }
  }
  return true;
}

function showOverlay(icon, title, subtitle, btnText, onClick) {
  const container = document.getElementById('overlayContainer');
  container.innerHTML = `
    <div class="overlay">
      <div class="modal">
        <div class="icon">${icon}</div>
        <div class="title">${title}</div>
        <div class="subtitle">${subtitle}</div>
        <button id="modalBtn">${btnText}</button>
      </div>
    </div>
  `;
  document.getElementById('modalBtn').addEventListener('click', () => {
    container.innerHTML = '';
    onClick();
  });
}

function checkGameState() {
  if (state.score >= state.target) {
    state.gameStatus = 'win';
    const nextLevel = state.level + 1;
    setMaxLevel(nextLevel);

    const ratio = state.score / state.target;
    let stars = 1;
    if (ratio >= 2.2) stars = 3;
    else if (ratio >= 1.6) stars = 2;
    setStars(state.level, stars);

    const starsHtml = [1,2,3].map(s =>
      `<span class="star${s <= stars ? ' earned' : ' empty'}" style="animation-delay:${s*0.15}s">★</span>`
    ).join('');

    showOverlay('🎉', '恭喜过关！',
      `<div>第 ${state.level} 关完成</div><div class="stars-row">${starsHtml}</div><div style="font-size:12px;color:rgba(255,255,255,.4);margin-top:4px">得分: ${state.score}</div>`,
      '返回地图', () => { showMap(); });
    return;
  }

  if (state.stepsLeft <= 0) {
    state.gameStatus = 'lose';
    showOverlay('😢', '步数用完', `得分: ${state.score} / ${state.target}`, '重试本关', () => {
      resetLevel();
    });
    return;
  }

  if (checkDeadlock()) {
    state.gameStatus = 'lose';
    showOverlay('🔒', '死局！', `无可消除的方块，得分: ${state.score}`, '重试本关', () => {
      resetLevel();
    });
    return;
  }
}

function updateUI() {
  document.getElementById('levelTitle').textContent = state.level;
  document.getElementById('scoreText').textContent = state.score;
  document.getElementById('stepsText').textContent = state.stepsLeft;
  const pct = (state.stepsLeft / state.totalSteps) * 100;
  document.getElementById('stepsFill').style.width = pct + '%';
}

function updateScore(add) {
  state.score += add;
  updateUI();
}

// ===== 粒子系统 =====
let _pSystem = null;

function _ensureParticleSystem() {
  if (_pSystem) return _pSystem;
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  const allParticles = [];
  let animId = null;
  let lastW = 0, lastH = 0;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = devicePixelRatio || 1;
    const w = rect.width * dpr;
    const h = rect.height * dpr;
    if (w !== lastW || h !== lastH) {
      canvas.width = w;
      canvas.height = h;
      lastW = w; lastH = h;
    }
    return { rect, dpr };
  }

  function spawn(cx, cy, color, count) {
    const { rect } = resize();
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 60 + Math.random() * 140;
      allParticles.push({
        x: cx * rect.width, y: cy * rect.height,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 30,
        life: 1, decay: 1.2 + Math.random() * 1.8,
        size: 3 + Math.random() * 4, color: color,
      });
    }
  }

  function tick() {
    const { rect, dpr } = resize();
    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, rect.width, rect.height);
    for (let i = allParticles.length - 1; i >= 0; i--) {
      const p = allParticles[i];
      p.x += p.vx * 0.016;
      p.y += p.vy * 0.016;
      p.vy += 120 * 0.016;
      p.life -= p.decay * 0.016;
      if (p.life <= 0) { allParticles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    animId = allParticles.length > 0 ? requestAnimationFrame(tick) : null;
  }

  function addParticles(cx, cy, color, count) {
    spawn(cx, cy, color, count);
    if (!animId) animId = requestAnimationFrame(tick);
  }

  _pSystem = { addParticles };
  return _pSystem;
}

function spawnMatchParticles(matches) {
  const boardEl = document.getElementById('board');
  const boardRect = boardEl.getBoundingClientRect();
  const canvas = document.getElementById('particleCanvas');
  const canvasRect = canvas.getBoundingClientRect();
  const ps = _ensureParticleSystem();

  for (const { r, c } of matches) {
    const color = CELL_COLORS[board[r][c]] || '#FF6B6B';
    const cellSize = boardRect.width / COLS;
    const cx = (c * cellSize + cellSize / 2 - canvasRect.left) / canvasRect.width;
    const cy = (r * cellSize + cellSize / 2 - canvasRect.top) / canvasRect.height;
    ps.addParticles(cx, cy, color, 8);
  }
}

// ===== 得分上浮 =====
function showScoreFloat(r, c, points) {
  const boardEl = document.getElementById('board');
  const cells = boardEl.querySelectorAll('.cell');
  const idx = r * COLS + c;
  if (idx >= cells.length) return;
  const cell = cells[idx];
  const rect = cell.getBoundingClientRect();

  const el = document.createElement('div');
  el.className = 'score-float';
  el.textContent = '+' + points;
  el.style.left = rect.left + rect.width / 2 - 20 + 'px';
  el.style.top = rect.top + 'px';
  document.getElementById('scoreFloatContainer').appendChild(el);
  setTimeout(() => el.remove(), 900);
}

// ===== Combo 分级 =====
const COMBO_TIERS = [
  { min: 2, text: 'Nice!', color: '#FF9A76' },
  { min: 3, text: 'Great!', color: '#FF6B6B' },
  { min: 4, text: 'Excellent!', color: '#FF4757' },
  { min: 5, text: 'Amazing!', color: '#9B7BFF' },
  { min: 6, text: 'Perfect!', color: '#FF6B6B' },
  { min: 8, text: 'Unbelievable!', color: '#FF4757' },
];

function showComboTier(combo) {
  let tier = null;
  for (const t of COMBO_TIERS) {
    if (combo >= t.min) tier = t;
  }
  if (!tier) return;

  const container = document.getElementById('comboContainer');
  const el = document.createElement('div');
  el.className = 'combo-popup';
  el.textContent = tier.text;
  el.style.color = tier.color;
  el.style.textShadow = `0 2px 16px ${tier.color}40`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

// ===== 胜利粒子雨 =====
function spawnWinConfetti() {
  const colors = ['#FF6B6B', '#FF9A76', '#FFD93D', '#6BCB77', '#4D96FF', '#9B7BFF'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'win-particle';
      el.style.left = Math.random() * 100 + '%';
      el.style.top = -(10 + Math.random() * 30) + 'px';
      el.style.width = (6 + Math.random() * 8) + 'px';
      el.style.height = (6 + Math.random() * 10) + 'px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (1 + Math.random() * 1.5) + 's';
      el.style.animationDelay = '0s';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }, i * 20);
  }
}

// ===== 失败特效 =====
function triggerLoseEffect() {
  const boardEl = document.getElementById('board');
  boardEl.classList.add('shake', 'grayout');
  setTimeout(() => {
    boardEl.classList.remove('shake', 'grayout');
  }, 600);
}

// ===== 增强 markRemovingCells 加粒子 =====
const _markRemovingCells = markRemovingCells;
markRemovingCells = function(matches) {
  _markRemovingCells(matches);
  spawnMatchParticles(matches);
};

// ===== 增强 updateAllCells 加掉落弹跳 =====
const _updateAllCells = updateAllCells;
updateAllCells = function() {
  _updateAllCells();
  const cells = document.querySelectorAll('.board .cell');
  cells.forEach(c => {
    c.classList.add('drop-in');
    c.addEventListener('animationend', () => c.classList.remove('drop-in'), { once: true });
  });
};

// ===== 增强 showOverlay 加输赢特效 =====
const _showOverlay = showOverlay;
showOverlay = function(icon, title, subtitle, btnText, onClick) {
  if (title === '恭喜过关！') spawnWinConfetti();
  if (title === '步数用完' || title === '死局！') triggerLoseEffect();
  _showOverlay(icon, title, subtitle, btnText, onClick);
};

document.getElementById('board').addEventListener('touchend', handleTouchEnd);

(async function boot() {
  document.getElementById('mapPath').innerHTML = '<div style="text-align:center;color:rgba(255,255,255,.4);padding:48px 0;font-size:13px">加载中...</div>';
  await initImages();
  renderMap();
})();
